# Default distribution: "plain" Mosaikit, with the official plugins.
# A derived product has its own distribution.toml in its project and is
# built with `cargo xtask --dist ../<product> <command>`.

[product]
# technical identifier: names of the release files and of the Docker image
id = "mosaikit"
# name shown to users (title, sign-in, icon in the notification area)
name = "Mosaikit"
# version of the product
version = "1.2.0"
description = "Multi-tenant web platform built out of plugins"
# name of the desktop executable (without .exe)
executable = "mosaikit"

[brand]
# folder with brand.toml (colours, texts) and the images (logo, favicon, icon)
dir = "branding"

[plugins]
# folders that contain plugins (each with its own Cargo and npm workspace)
roots = ["../mosaikit-plugins"]
# plugins to include in the releases: "*" = every one found
include = ["*"]

# The apps of the sidebar in four groups (architecture 14.3). Apps not listed stay flat at the bottom.
[[nav_groups]]
id = "information"
label = "Information"
icon = "book-open"
plugins = ["com.mosaikit.files", "com.mosaikit.notes", "com.mosaikit.snippets", "com.mosaikit.bookmarks", "com.mosaikit.whiteboard", "com.mosaikit.static-site"]
[nav_groups.i18n.it]
label = "Informazioni"
[nav_groups.i18n.es]
label = "Información"
[nav_groups.i18n.pt]
label = "Informação"
[nav_groups.i18n.fr]
label = "Information"
[nav_groups.i18n.nl]
label = "Informatie"
[nav_groups.i18n.ar]
label = "المعلومات"
[nav_groups.i18n.zh]
label = "信息"
[nav_groups.i18n.ru]
label = "Информация"

