# Default distribution: "plain" Mosaikit, with the official plugins.
# A derived product has its own distribution.toml in its project and is
# built with `cargo xtask --dist ../<product> <command>`.

[product]
# technical identifier: names of the release files and of the Docker image
id = "mosaikit"
# name shown to users (title, sign-in, icon in the notification area)
name = "Mosaikit"
# version of the product
version = "1.0.0"
description = "Multi-tenant web platform built out of plugins"
# name of the desktop executable (without .exe)
executable = "mosaikit"

[brand]
# folder with brand.toml (colours, texts) and the images (logo, favicon, icon)
dir = "branding"

[plugins]
# folders that contain plugins (each with its own Cargo and npm workspace)
roots = ["../mosaikit-plugins"]
# plugins to include in the releases: "*" = every one found
include = ["*"]

[desktop]
# database of the desktop version: "sqlite" (no server to start) or "postgres" (embedded PostgreSQL)
database = "sqlite"
# port of the desktop app; plugins and contents use the next one
port = 48080

[docker]
# name of the Docker image
image = "mosaikit"
# PostgreSQL image used by the compose
postgres_image = "postgres:17-alpine"
