plugins = ["com.mosaikit.contacts", "com.mosaikit.approvals", "com.mosaikit.forms", "com.mosaikit.surveys", "com.mosaikit.polls"]
[nav_groups.i18n.it]
label = "Persone e processi"
[nav_groups.i18n.es]
label = "Personas y procesos"
