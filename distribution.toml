[nav_groups.i18n.it]
label = "Lavoro e progetti"
[nav_groups.i18n.es]
label = "Trabajo y proyectos"
[nav_groups.i18n.pt]
label = "Trabalho e projetos"
[nav_groups.i18n.fr]
