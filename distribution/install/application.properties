#
# Settings of this installation, read by the kernel from config/ in the installation directory.
# Every setting can also be given as an environment variable, for example
# QUARKUS_DATASOURCE_PASSWORD for quarkus.datasource.password.

# PostgreSQL 18 database
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/mosaikit
quarkus.datasource.username=mosaikit
quarkus.datasource.password=change-me

# Password of the platform administrator "admin", used only at the first start of an empty
# database. Remove it once the administrator has signed in.
mosaikit.bootstrap.admin-password=change-me-too

# HTTP port
quarkus.http.port=8080

# Federated sign-in (MK-012): public URL of Keycloak, as it appears in the tokens, and the domain
# whose sub-domains are organization slugs (acme.mosaikit.example.org -> organization "acme").
# Set the realm and the email domains of each organization with
# PUT /api/v1/organizations/<slug>/identity. See distribution/keycloak/README.md.
#mosaikit.identity.keycloak-url=https://auth.example.org
#mosaikit.identity.domain=mosaikit.example.org
# Service account of the master realm (admin role) with which the kernel creates the realm of each
# new organization created with "federation" (MK-018). Without it, realms are created by hand.
#mosaikit.identity.admin.client-id=mosaikit-admin
#mosaikit.identity.admin.client-secret=<secret>

# Marketplace (MK-022): comma-separated catalogs of plugins, each a directory with a signed
# index.json: the catalog of the project, a catalog of your own, a directory of this installation
# (a relative path such as catalog/) or a removable drive for an installation without network.
# Trust the key of their publisher in config/trusted-keys. None by default: the installation
# starts without plugins (ADR-0035).
#mosaikit.marketplace.sources=https://mosaikit.github.io/catalog/,catalog/,file:/media/usb/mosaikit-plugins/
# Largest package downloaded or uploaded, in bytes (256 MB).
#mosaikit.marketplace.max-package-bytes=268435456

# Assistant (MK-024): an OpenAI-compatible API, local (Ollama, vLLM) or hosted. Without a URL the
# assistant is off; MCP clients keep using the tools of the plugins.
#mosaikit.assistant.url=http://localhost:11434/v1
#mosaikit.assistant.model=llama3.1
#mosaikit.assistant.api-key=<token of a hosted service>

# Session of the shell for local accounts: how long it lasts without activity, and the key that
# encrypts its cookie. Without a key the sessions end at every restart; set the same key on every
# kernel of a cluster.
#quarkus.http.auth.form.timeout=PT8H
#quarkus.http.auth.session.encryption-key=<at least 16 random characters>

# Signed plugin packages (MK-013): the public keys of trusted publishers are in
# config/trusted-keys. "optional" accepts unsigned plugins and refuses changed packages;
# "required" accepts only packages signed with a trusted key.
#mosaikit.plugins.signatures=required
