#
# Mosaikit with PostgreSQL 18 and Keycloak, ready to use:
#
#   docker compose up -d --build
#
# Mosaikit: http://localhost:8080 (admin / MOSAIKIT_ADMIN_PASSWORD of .env)
# Keycloak: http://localhost:8180 (admin / KEYCLOAK_ADMIN_PASSWORD of .env)
# See README.md.

name: mosaikit

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: mosaikit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env}
      POSTGRES_DB: mosaikit
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set it in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
      # Creates the keycloak database and user at the first start.
      - ./postgres/init-keycloak.sh:/docker-entrypoint-initdb.d/init-keycloak.sh:ro
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U mosaikit -d mosaikit && pg_isready -U keycloak -d keycloak']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    # Development mode (HTTP, relaxed checks). For production see README.md.
    command: ['start-dev', '--http-port=8080']
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set it in .env}
      # Service account with which Mosaikit creates the realm of each new organization (MK-018).
      KC_BOOTSTRAP_ADMIN_CLIENT_ID: mosaikit-admin
      KC_BOOTSTRAP_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?set it in .env}
      # Browsers reach Keycloak at the public URL, the kernel at http://keycloak:8080: tokens carry
      # the public URL, the back-channel URLs follow the host of each request.
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8180}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: 'true'
      KC_HEALTH_ENABLED: 'true'
    ports:
      - '8180:8080'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The image has no curl: a plain HTTP request on the management port.
      test:
        [
          'CMD-SHELL',
          "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  mosaikit:
    build:
      # The installation next to this directory (target/dist/mosaikit).
      context: ..
      dockerfile: mosaikit-docker/Dockerfile
    image: mosaikit:local
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/mosaikit
      QUARKUS_DATASOURCE_USERNAME: mosaikit
      QUARKUS_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      MOSAIKIT_BOOTSTRAP_ADMIN_PASSWORD: ${MOSAIKIT_ADMIN_PASSWORD:?set it in .env}
      MOSAIKIT_IDENTITY_KEYCLOAK_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8180}
      MOSAIKIT_IDENTITY_KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      MOSAIKIT_IDENTITY_ADMIN_CLIENT_ID: mosaikit-admin
      MOSAIKIT_IDENTITY_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
      # Signed plugin packages (MK-013): "required" accepts only packages signed with a key of
      # /opt/mosaikit/config/trusted-keys, which includes the key that signed ../plugins.
      MOSAIKIT_PLUGINS_SIGNATURES: ${MOSAIKIT_PLUGINS_SIGNATURES:-optional}
    ports:
      - '8080:8080'
    volumes:
      # Copy plugin packages (*.zip) here and run: docker compose restart mosaikit
      - ./plugins:/opt/mosaikit/plugins
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
