{{- if .Values.extensions.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "mosaikit.fullname" . }}-extensions
  labels:
    {{- include "mosaikit.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.extensions.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.extensions.persistence.size }}
{{- end }}
{{- if eq .Values.files.store "filesystem" }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "mosaikit.fullname" . }}-files
  labels:
    {{- include "mosaikit.labels" . | nindent 4 }}
spec:
  accessModes: [{{ .Values.files.persistence.accessMode }}]
  {{- with .Values.files.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.files.persistence.size }}
{{- end }}
