apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mosaikit.fullname" . }}
  labels:
    {{- include "mosaikit.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "mosaikit.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mosaikit.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: kernel
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: {{ .Values.database.url | quote }}
            - name: QUARKUS_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: username
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: password
            {{- if .Values.bootstrap.existingSecret }}
            - name: MOSAIKIT_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.bootstrap.existingSecret }}
                  key: password
            {{- end }}
            {{- with .Values.identity.keycloakUrl }}
            - name: MOSAIKIT_IDENTITY_KEYCLOAK_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.identity.keycloakInternalUrl }}
            - name: MOSAIKIT_IDENTITY_KEYCLOAK_INTERNAL_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.identity.adminSecret }}
            - name: MOSAIKIT_IDENTITY_ADMIN_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: client-id
            - name: MOSAIKIT_IDENTITY_ADMIN_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: client-secret
            {{- end }}
            {{- with .Values.identity.domain }}
            - name: MOSAIKIT_IDENTITY_DOMAIN
              value: {{ . | quote }}
            {{- end }}
            - name: MOSAIKIT_EXTENSIONS_SIGNATURES
              value: {{ .Values.extensions.signatures | quote }}
            {{- if .Values.extensions.trustedKeysConfigMap }}
            - name: MOSAIKIT_EXTENSIONS_TRUSTED_KEYS_DIRECTORY
              value: /etc/mosaikit/trusted-keys
            {{- end }}
            - name: MOSAIKIT_FILES_STORE
              value: {{ .Values.files.store | quote }}
            - name: MOSAIKIT_FILES_MAX_SIZE
              value: {{ .Values.files.maxSize | quote }}
            - name: QUARKUS_HTTP_LIMITS_MAX_BODY_SIZE
              value: {{ .Values.files.maxSize | quote }}
            {{- if eq .Values.files.store "filesystem" }}
            - name: MOSAIKIT_FILES_DIRECTORY
              value: /var/lib/mosaikit/files
            {{- else }}
            {{- with .Values.files.s3.endpoint }}
            - name: MOSAIKIT_FILES_S3_ENDPOINT
              value: {{ . | quote }}
            {{- end }}
            - name: MOSAIKIT_FILES_S3_REGION
              value: {{ .Values.files.s3.region | quote }}
            - name: MOSAIKIT_FILES_S3_BUCKET
              value: {{ required "files.s3.bucket is required with files.store=s3" .Values.files.s3.bucket | quote }}
            - name: MOSAIKIT_FILES_S3_PATH_STYLE
              value: {{ .Values.files.s3.pathStyle | quote }}
            {{- with .Values.files.s3.existingSecret }}
            - name: MOSAIKIT_FILES_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: access-key-id
            - name: MOSAIKIT_FILES_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: secret-access-key
            {{- end }}
            {{- end }}
            {{- with include "mosaikit.extraEnv" . | trim }}
            {{- . | nindent 12 }}
            {{- end }}
          {{- with .Values.kernel.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- if .Values.extensions.persistence.enabled }}
            - name: extensions
              mountPath: /opt/mosaikit/extensions
            {{- end }}
            {{- if .Values.extensions.trustedKeysConfigMap }}
            - name: trusted-keys
              mountPath: /etc/mosaikit/trusted-keys
              readOnly: true
            {{- end }}
            {{- if eq .Values.files.store "filesystem" }}
            - name: files
              mountPath: /var/lib/mosaikit/files
            {{- end }}
            - name: tmp
              mountPath: /tmp
      volumes:
        {{- if .Values.extensions.persistence.enabled }}
        - name: extensions
          persistentVolumeClaim:
            claimName: {{ include "mosaikit.fullname" . }}-extensions
        {{- end }}
        {{- with .Values.extensions.trustedKeysConfigMap }}
        - name: trusted-keys
          configMap:
            name: {{ . }}
        {{- end }}
        {{- if eq .Values.files.store "filesystem" }}
        - name: files
          persistentVolumeClaim:
            claimName: {{ include "mosaikit.fullname" . }}-files
        {{- end }}
        - name: tmp
          emptyDir: {}
