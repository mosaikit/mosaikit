image:
  repository: ghcr.io/mosaikit/mosaikit
  tag: ""          # defaults to the chart appVersion
  pullPolicy: IfNotPresent

replicaCount: 1

database:
  # JDBC URL and credentials of PostgreSQL 18; the secret must contain `username` and `password`.
  url: jdbc:postgresql://postgresql:5432/mosaikit
  existingSecret: mosaikit-database

bootstrap:
  # Secret with key `password` for the first platform administrator. Remove after first start.
  existingSecret: ""

identity:
  # Federated sign-in (MK-012): public URL of Keycloak, as it appears in the tokens, and the
  # domain whose sub-domains are organization slugs. Empty: local accounts only.
  keycloakUrl: ""
  # URL at which the kernel reaches Keycloak inside the cluster, when it differs from keycloakUrl.
  keycloakInternalUrl: ""
  # Secret with keys client-id and client-secret of the Keycloak service account with which the
  # kernel creates the realms of new organizations (MK-018). Empty: realms are created by hand.
  adminSecret: ""
  domain: ""

kernel:
  # Settings of the kernel that the chart does not name (MK-129), as in config/application.properties
  # of an installation (see docs/guide/configuration.md): the name of the setting, and its value or a
  # reference to a Secret or a ConfigMap. Each becomes an environment variable, the name in upper case
  # with every character that is not a letter or a digit replaced by "_", which the kernel reads in
  # place of the file. A setting of the chart given here as well takes this value. Never write a
  # password, a token or a key here: refer to a Secret.
  #
  #   extraSettings:
  #     mosaikit.accounts.session-timeout: 4h
  #     quarkus.log.category."dev.mosaikit".level: DEBUG
  #     mosaikit.secrets.master-key:
  #       valueFrom:
  #         secretKeyRef: { name: mosaikit-secrets, key: master-key }
  extraSettings: {}
  # More environment variables, as in a container: name with value or valueFrom.
  extraEnv: []
  # Secrets and ConfigMaps whose keys are environment variables, as in a container (envFrom), such
  # as a Secret with MOSAIKIT_SECRETS_MASTER_KEY.
  extraEnvFrom: []

extensions:
  # The settings of an extension (MK-129), under its identifier: the same form as
  # kernel.extraSettings, read by the extension as settings of the installation.
  #
  #   org.example.reports:
  #     settings:
  #       example.reports.endpoint: https://reports.example.org
  #       example.reports.api-key:
  #         valueFrom:
  #           secretKeyRef: { name: reports, key: api-key }
  #
  # Extensions with Java code are built into a derived image (see distribution/docker/Containerfile),
  # so that the container keeps a read-only root filesystem. A volume can hold extensions without
  # Java code (frontend, migrations); Java extensions found there stay RESTART_REQUIRED.
  persistence:
    enabled: false
    size: 1Gi
    storageClass: ""
  # Signed packages (MK-013): "optional" accepts unsigned extensions and refuses changed packages,
  # "required" accepts only packages signed with a trusted key.
  signatures: optional
  # ConfigMap whose entries are the public keys (<name>.pub.pem) of trusted publishers. Empty: the
  # keys of the image, config/trusted-keys, which include the key that signed its sample extensions.
  trustedKeysConfigMap: ""

files:
  # Where the kernel keeps the files of extensions (MK-041): "filesystem", a volume mounted at
  # /var/lib/mosaikit/files, or "s3", a bucket of an S3-compatible object store.
  store: filesystem
  # Largest file; the HTTP limit of the kernel is raised to the same size.
  maxSize: 10M
  persistence:
    # With more than one replica the volume must be shared (ReadWriteMany), or use s3.
    size: 10Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  s3:
    # Empty for Amazon S3, whose URL follows from the region.
    endpoint: ""
    region: us-east-1
    bucket: ""
    pathStyle: false
    # Secret with keys access-key-id and secret-access-key. Empty: the credentials of the pod, such
    # as the role of its service account.
    existingSecret: ""

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    memory: 512Mi

service:
  type: ClusterIP
  port: 80

proxy:
  # The ingress or load balancer in front of the kernel terminates TLS and forwards the scheme and the
  # address of the client in X-Forwarded-Proto and X-Forwarded-For: the kernel takes them, so that its
  # cookies carry Secure and sessions record the address of the person. Set it to false only when
  # nothing in front of the kernel sets these headers.
  forwardedHeaders: true
  # Comma-separated addresses, CIDR ranges or host names of the proxies whose forwarded headers the
  # kernel believes, such as the pod network of the ingress controller (10.244.0.0/16). Empty: any
  # address that reaches the pod, accepted only with service.type ClusterIP, which only the cluster
  # reaches; with NodePort or LoadBalancer the chart refuses to render without it, since a client
  # could then send the headers itself.
  trustedProxies: ""
  # Cookies of the kernel always Secure (mosaikit.accounts.secure-cookies), for an installation
  # reached only over HTTPS whatever the proxy forwards.
  secureCookies: false

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 185
  fsGroup: 185
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
