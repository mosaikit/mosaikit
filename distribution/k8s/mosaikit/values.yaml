image:
  repository: ghcr.io/mosaikit/mosaikit
  tag: ""          # defaults to the chart appVersion
  pullPolicy: IfNotPresent

replicaCount: 1

database:
  # JDBC URL and credentials of PostgreSQL 18; the secret must contain `username` and `password`.
  url: jdbc:postgresql://postgresql:5432/mosaikit
  existingSecret: mosaikit-database

bootstrap:
  # Secret with key `password` for the first platform administrator. Remove after first start.
  existingSecret: ""

identity:
  # Federated sign-in (MK-012): public URL of Keycloak, as it appears in the tokens, and the
  # domain whose sub-domains are organization slugs. Empty: local accounts only.
  keycloakUrl: ""
  # URL at which the kernel reaches Keycloak inside the cluster, when it differs from keycloakUrl.
  keycloakInternalUrl: ""
  # Secret with keys client-id and client-secret of the Keycloak service account with which the
  # kernel creates the realms of new organizations (MK-018). Empty: realms are created by hand.
  adminSecret: ""
  domain: ""

extensions:
  # Extensions with Java code are built into a derived image (see distribution/docker/Containerfile),
  # so that the container keeps a read-only root filesystem. A volume can hold extensions without
  # Java code (frontend, migrations); Java extensions found there stay RESTART_REQUIRED.
  persistence:
    enabled: false
    size: 1Gi
    storageClass: ""
  # Signed packages (MK-013): "optional" accepts unsigned extensions and refuses changed packages,
  # "required" accepts only packages signed with a trusted key.
  signatures: optional
  # ConfigMap whose entries are the public keys (<name>.pub.pem) of trusted publishers. Empty: the
  # keys of the image, config/trusted-keys, which include the key that signed its sample extensions.
  trustedKeysConfigMap: ""

files:
  # Where the kernel keeps the files of extensions (MK-041): "filesystem", a volume mounted at
  # /var/lib/mosaikit/files, or "s3", a bucket of an S3-compatible object store.
  store: filesystem
  # Largest file; the HTTP limit of the kernel is raised to the same size.
  maxSize: 10M
  persistence:
    # With more than one replica the volume must be shared (ReadWriteMany), or use s3.
    size: 10Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  s3:
    # Empty for Amazon S3, whose URL follows from the region.
    endpoint: ""
    region: us-east-1
    bucket: ""
    pathStyle: false
    # Secret with keys access-key-id and secret-access-key. Empty: the credentials of the pod, such
    # as the role of its service account.
    existingSecret: ""

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    memory: 512Mi

service:
  type: ClusterIP
  port: 80

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 185
  fsGroup: 185
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
