#
# Settings of this portable installation, read by the kernel at start.
#
# The bundled PostgreSQL is managed by the mosaikit launcher: its connection settings are generated in
# config/database.properties at each start (do not edit that file). The database files are in
# data/. To back up the installation, stop it and copy the whole data/ directory.
#
# Every setting can also be given as an environment variable, for example QUARKUS_HTTP_PORT.
# MOSAIKIT_DATABASE_PORT changes the port of the bundled PostgreSQL (default 54329).

# Web interface and API: http://localhost:8080. Only this computer can connect; set the host to
# 0.0.0.0 to accept connections from the network, after changing the administrator password.
quarkus.http.host=127.0.0.1
quarkus.http.port=8080
# Behind a reverse proxy on this computer that serves Mosaikit over HTTPS: take the scheme from its
# X-Forwarded-Proto header, from this computer only, so that the cookies carry Secure.
#quarkus.http.proxy.proxy-address-forwarding=true
#quarkus.http.proxy.allow-x-forwarded=true
#quarkus.http.proxy.trusted-proxies=127.0.0.1

# Files of extensions (MK-041): in data/, so that a copy of data/ backs them up with the database.
mosaikit.files.directory=data/files
# Largest file; uploads through the REST API also need quarkus.http.limits.max-body-size as large.
#mosaikit.files.max-size=10M

# Settings of extensions (MK-129): each extension names its own in its documentation, for example
# the address of the service of an example extension. Like every setting, also an environment
# variable (EXAMPLE_REPORTS_ENDPOINT).
#example.reports.endpoint=https://reports.example.org
