# =============================================================================
#  mosaikit.toml - configuration of Mosaikit
# =============================================================================
#  Every property is optional: the commented ones show the default value.
#  Every property can also be set with an environment variable (shown next to
#  it), which takes precedence over the file.
#  Relative paths are relative to the folder of this file.
# =============================================================================

# Address users open Mosaikit with, with an optional base path.
# It is the only address to set: the others are derived from it.
# Examples: "http://127.0.0.1:8080"  "http://127.0.0.1:8080/mosaikit"  "https://gis.example.com/mosaikit"
# Env: MOSAIKIT_URL
url = "http://127.0.0.1:8080/mosaikit"

# Address of the plugin UIs, of the uploaded files and of the public links.
# For security it must be a DIFFERENT ORIGIN from `url` (another host or another port):
# so the code of the plugins cannot read the cookies nor call the API of the app.
# Default: the same address as `url` on the next port (e.g. :8081).
# Behind a reverse proxy a second hostname is normally used.
# With a wildcard as the first label of the host every plugin UI gets an origin of its own
# (<plugin>.plugins.example.com, e.g. com-mosaikit-notes.plugins.example.com), so that plugins are
# isolated from each other too; contents and public links go to public.plugins.example.com. It needs a
# wildcard DNS record and certificate; in development "http://*.localhost:8081" works as it is.
# Env: MOSAIKIT_PLUGIN_URL
# plugin_url = "https://plugins.example.com/mosaikit"
# plugin_url = "https://*.plugins.example.com"

# Address and port the server listens on for the app.
# Default: the port of `url`; local only (127.0.0.1) if the host of `url` is local,
# otherwise every interface (0.0.0.0). It must be set behind a reverse proxy.
# Env: MOSAIKIT_LISTEN
# listen = "0.0.0.0:8080"

# Like `listen`, for plugins, files and public links. Default: the port of `plugin_url`.
# Env: MOSAIKIT_PLUGIN_LISTEN
# plugin_listen = "0.0.0.0:8081"

# Data folder: uploaded files, plugin packages, logs, SQLite database.
# Env: MOSAIKIT_DATA_DIR
# data_dir = "data"

# Branding folder (brand.toml with name, colours and texts, plus logo and favicon).
# If absent, the Mosaikit brand included in the executable is used.
# Env: MOSAIKIT_BRAND
# brand = "branding"

# Accepts unsigned plugin packages. For development only: false in production.
# Env: MOSAIKIT_ALLOW_UNSIGNED
# allow_unsigned = false

# Private destinations that plugins may call with http.fetch: exact "host:port" entries (no wildcards,
# no ranges). Only for a plugin whose manifest lists that origin in its network permission. A malformed
# entry stops the start. Not needed for public services.
# Env: MOSAIKIT_ALLOW_PRIVATE_FETCH_HOSTS (comma separated, added to the ones of the file)
# allow_private_fetch_hosts = ["translate.internal:5000"]

# TOML file with [[plugin_settings]] (plugin, key, value) and [[service_key_values]] (service, value,
# shared) seeded at the start, only while unset, never over an Administrator choice. A value is
# "env:NAME", "file:PATH" (relative to this file folder) or a literal; reference secrets, do not write
# them. A distribution.toml works as it is.
# Env: MOSAIKIT_PLUGIN_SETTINGS_FILE
# plugin_settings_file = "distribution.toml"

# ed25519 public keys (base64) of the trusted plugin publishers: only packages
# signed by one of these keys are installed.
# Env: MOSAIKIT_TRUSTED_KEYS (comma separated, added to the ones of the file)
# trusted_keys = ["MCowBQYDK2VwAyEA..."]

# Catalog of the installable plugins (index.json file with name, version and sha256 of the packages).
# Env: MOSAIKIT_REGISTRY
# registry = "registry/index.json"

# At start installs and turns on the plugins of the catalog not installed yet.
# Env: MOSAIKIT_PREINSTALL
# preinstall = false

# Lifetime of a sign-in session, in hours: the default of the setting «Length of the session» of
# the platform (System › Passwords and sessions), which the Administrator can change.
# session_ttl_hours = 12

# Key (32 bytes in base64) that encrypts the keys of outside services in the database. Without it,
# the file `secret.key` in data_dir, created at the first start: keep it with the backups (without
# it the keys must be entered again). With several servers on the same database, the same value on
# all of them. Generate one with: openssl rand -base64 32
# Env: MOSAIKIT_SECRET_KEY
# secret_key = "…"

# Second factor (TOTP: Google/Microsoft Authenticator, FreeOTP...) required for the
# Administrators. At the first sign-in the app shows the QR code to register and the recovery
# codes. Turn it off only for local use (desktop version). In an emergency:
# `<executable> reset-totp --user <username>`.
# Env: MOSAIKIT_ADMIN_TOTP
# admin_totp = true

# At the first start also creates a work tenant with this slug (name: the one of the product)
# and its Tenant Manager "user", with a generated password. The Administrator has no
# workspace: it is meant for local use (desktop version), where one works at once.
# The credentials are in <data_dir>/credenziali-iniziali.txt.
# Env: MOSAIKIT_INITIAL_TENANT
# initial_tenant = "locale"

# Password of the accounts created at the first start (admin and, with initial_tenant, user)
# instead of the generated ones. It holds even if shorter than the policy (10 characters): to change
# at the first sign-in. For local use only (desktop); MOSAIKIT_ADMIN_PASSWORD takes precedence for admin.
# Env: MOSAIKIT_INITIAL_PASSWORD
# initial_password = "mosaikit"

# Opens the browser on `url` at start (desktop version).
# Env: MOSAIKIT_OPEN_BROWSER
# open_browser = false

# Uses the X-Forwarded-For header for the address of the client (limits on sign-in attempts).
# Turn it on ONLY behind a reverse proxy that sets it: otherwise it can be forged. The last address of
# the header counts (the one the proxy added), so exactly one proxy must sit in front of Mosaikit.
# Env: MOSAIKIT_TRUST_PROXY
# trust_proxy = false

[database]
# Database: "sqlite" or "postgres".
# Default: "postgres" if `url` or `embedded` is set, otherwise "sqlite".
# Env: MOSAIKIT_DATABASE
# backend = "sqlite"

# SQLite: database file. Default: <data_dir>/mosaikit.db
# file = "data/mosaikit.db"

# PostgreSQL: connection string. The user must be able to create roles and schemas
# (CREATEROLE, CREATE on the database): every plugin has its own schema and its own role.
# Env: MOSAIKIT_DATABASE_URL (or DATABASE_URL)
# url = "postgres://mosaikit:password@127.0.0.1:5432/mosaikit"

# Embedded PostgreSQL: starts a private PostgreSQL in <data_dir>/pg (desktop).
# embedded = false

# PostgreSQL `bin` folder for the embedded mode.
# Default: `pgsql/bin` next to the executable.
# pg_bin = "pgsql/bin"

# Port of the embedded PostgreSQL (if taken, a free one is looked for). Default 55433.
# embedded_port = 55433

# Maximum number of connections to the database of the app.
# max_connections = 20

[archives]
# Limits on what an archive may unpack when an Administrator imports the export of a tenant or restores
# from a backup. The sizes written in a zip can lie: the bytes are counted as they are unpacked.
# Total of the unpacked bytes, in MB.
# max_unpacked_mb = 51200
# Number of entries.
# max_entries = 1000000
# One table of data (JSON) read into memory, in MB.
# max_json_mb = 1024

[dev]
# Development mode: the plugins are read from the source folders with hot reload
# of logic and UI. Never in production. `cargo xtask dev` turns it on.
# enabled = false

# Folders of the plugins in development.
# Env: MOSAIKIT_DEV_PLUGINS (separated as in PATH: ';' on Windows, ':' elsewhere)
# plugins = ["../mosaikit-plugins/notes"]

# cargo `target` folder used if the plugin is not in a cargo workspace.
# target_dir = "target"
