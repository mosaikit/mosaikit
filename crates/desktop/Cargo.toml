[package]
name = "mosaikit-desktop"
description = "Mosaikit desktop: applicazione senza console con icona nell'area di notifica"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mosaikit"
path = "src/main.rs"

[dependencies]
mosaikit-kernel.workspace = true
mosaikit-server = { path = "../server" }
tokio.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies]
tray-icon = "0.21"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_Console",
  "Win32_System_LibraryLoader",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
] }

# notifiche di Windows (toast) e registrazione del nome dell'app
windows = { version = "0.61", features = [
  "Data_Xml_Dom",
  "UI_Notifications",
  "Win32_Security",
  "Win32_System_Registry",
  "Win32_System_WinRT",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[lints]
workspace = true
