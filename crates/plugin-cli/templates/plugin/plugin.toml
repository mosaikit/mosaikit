id = "{{id}}"
name = "{{label}}"
version = "0.1.0"
description = "Describe the plugin {{label}} here"
# who made it and under which licence: the Administrator reads both before installing
author = "Your name"
license = "Apache-2.0"

# the versions of Mosaikit and of the plugin API this plugin works with
[requires]
mosaikit = ">=1.0, <2"
api = 1

[contribution]
icon = "🧱"
label = "{{label}}"

# CRUD resource: the host creates the table `{{table}}` (with resource_id, tenant_id and RLS).
# Every row is a kernel resource: it has an owner and can be shared.
[[resources]]
name = "{{table}}"
label = "{{label}}"
title_field = "title"
fields = [
  { key = "title", label = "Title", kind = "text", required = true },
  { key = "notes", label = "Notes", kind = "text", multiline = true },
  { key = "status", label = "Status", kind = "choice", options = ["draft", "active", "closed"] },
]

# Tools of the AI assistant: it lists, creates and edits the items of the resource above as the person who asks, with no code of
# yours (a tool that creates or edits is only proposed: the person confirms it). The texts are for the model: write them in English.
[[assistant_tools]]
name = "list_{{table}}"
description = "Lists or searches the {{label}} the person can see. Use q to look for words."
resource = "{{table}}"
action = "list"

[[assistant_tools]]
name = "create_{{table}}"
description = "Creates an item of {{label}} with a title, notes and a status (draft, active or closed)."
resource = "{{table}}"
action = "create"

[[assistant_tools]]
name = "update_{{table}}"
description = "Changes an item of {{label}}; give the id found with list_{{table}}."
resource = "{{table}}"
action = "update"

# What the assistant needs to know about this domain (optional).
[assistant]
prompt = "Describe here what a {{label}} item is and what its statuses mean."

[ui]
entry = "index.html"

[permissions]
hooks = ["{{table}}"]
files = false
content = false
network = []
frame_src = []

[[kpi]]
view = "kpi_{{table}}_by_status"
label = "{{label}} by status"

# Translations of the texts above (a text that is missing falls back to English).
# The names of the fields and of the options are the keys of the manifest, not the labels.
[i18n.it]
description = "Descrivi qui il plugin {{label}}"
label = "{{label}}"

[i18n.it.resources.{{table}}]
label = "{{label}}"
fields = { title = "Titolo", notes = "Note", status = "Stato" }
options.status = { draft = "bozza", active = "attivo", closed = "chiuso" }

[i18n.it.kpi.kpi_{{table}}_by_status]
label = "{{label}} per stato"

[i18n.es]
description = "Describe aquí el plugin {{label}}"
label = "{{label}}"

[i18n.es.resources.{{table}}]
label = "{{label}}"
fields = { title = "Título", notes = "Notas", status = "Estado" }
options.status = { draft = "borrador", active = "activo", closed = "cerrado" }

[i18n.es.kpi.kpi_{{table}}_by_status]
label = "{{label}} por estado"
