id = "{{id}}"
name = "{{label}}"
version = "0.1.0"
description = "Describe the plugin {{label}} here"

# the versions of Mosaikit and of the plugin API this plugin works with
[requires]
mosaikit = ">=1.0, <2"
api = 1

[contribution]
icon = "🧱"
label = "{{label}}"

# CRUD resource: the host creates the table `{{table}}` (with resource_id, tenant_id and RLS).
# Every row is a kernel resource: it has an owner and can be shared.
[[resources]]
name = "{{table}}"
label = "{{label}}"
title_field = "title"
fields = [
  { key = "title", label = "Title", kind = "text", required = true },
  { key = "notes", label = "Notes", kind = "text", multiline = true },
  { key = "status", label = "Status", kind = "choice", options = ["draft", "active", "closed"] },
]

[ui]
entry = "index.html"

[permissions]
hooks = ["{{table}}"]
files = false
content = false
network = []
frame_src = []

[[kpi]]
view = "kpi_{{table}}_by_status"
label = "{{label}} by status"

# Translations of the texts above (a text that is missing falls back to English).
# The names of the fields and of the options are the keys of the manifest, not the labels.
[i18n.it]
description = "Descrivi qui il plugin {{label}}"
label = "{{label}}"

[i18n.it.resources.{{table}}]
label = "{{label}}"
fields = { title = "Titolo", notes = "Note", status = "Stato" }
options.status = { draft = "bozza", active = "attivo", closed = "chiuso" }

[i18n.it.kpi.kpi_{{table}}_by_status]
label = "{{label}} per stato"

[i18n.es]
description = "Describe aquí el plugin {{label}}"
label = "{{label}}"

[i18n.es.resources.{{table}}]
label = "{{label}}"
fields = { title = "Título", notes = "Notas", status = "Estado" }
options.status = { draft = "borrador", active = "activo", closed = "cerrado" }

[i18n.es.kpi.kpi_{{table}}_by_status]
label = "{{label}} por estado"
