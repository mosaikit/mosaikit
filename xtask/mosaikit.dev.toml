# Configurazione di sviluppo (usata da `cargo xtask dev`). Le proprieta' sono
# descritte in mosaikit.example.toml. I percorsi relativi partono da questa
# cartella (xtask/).

# L'app si apre da Vite (HMR della UI host): Vite inoltra le API al server su :47080
url = "http://127.0.0.1:5173"
# UI dei plugin, file e link pubblici serviti direttamente dal server
plugin_url = "http://127.0.0.1:47081"
# porte del server di sviluppo
listen = "127.0.0.1:47080"
plugin_listen = "127.0.0.1:47081"
# dati di sviluppo, separati da quelli reali
data_dir = "../.dev/data"
# i plugin in sviluppo sono letti dalle cartelle: nessun pacchetto da firmare
allow_unsigned = true
# sessioni lunghe per non dover rifare l'accesso
session_ttl_hours = 72
# in sviluppo l'Administrator accede senza secondo fattore (in produzione e' obbligatorio)
admin_totp = false

[database]
# PostgreSQL di sviluppo avviato da `cargo xtask db up`
url = "postgres://mosaikit_dev:mosaikit_dev@127.0.0.1:55432/mosaikit"

[dev]
# hot reload; le cartelle dei plugin arrivano da `cargo xtask dev` (MOSAIKIT_DEV_PLUGINS)
enabled = true
