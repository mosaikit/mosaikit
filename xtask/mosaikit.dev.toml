# Development configuration (used by `cargo xtask dev`). The properties are
# described in mosaikit.example.toml. Relative paths start from this
# folder (xtask/).

# The app opens from Vite (HMR of the host UI): Vite forwards the API to the server on :47080
url = "http://127.0.0.1:5173"
# plugin UIs, files and public links served directly by the server
plugin_url = "http://127.0.0.1:47081"
# ports of the development server
listen = "127.0.0.1:47080"
plugin_listen = "127.0.0.1:47081"
# development data, separate from the real ones
data_dir = "../.dev/data"
# the plugins in development are read from the folders: no package to sign
allow_unsigned = true
# long sessions so as not to sign in again
session_ttl_hours = 72
# in development the Administrator signs in without a second factor (in production it is required)
admin_totp = false

[database]
# development PostgreSQL started by `cargo xtask db up`
url = "postgres://mosaikit_dev:mosaikit_dev@127.0.0.1:55432/mosaikit"

[dev]
# hot reload; the folders of the plugins come from `cargo xtask dev` (MOSAIKIT_DEV_PLUGINS)
enabled = true
