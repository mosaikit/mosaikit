# cargo-deny: known vulnerabilities (RustSec), licenses, sources of the dependencies.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Every exception says why it does not apply and when to drop it (docs/reports/dependencies.md).
ignore = [
  # proc-macro-error (unmaintained): build-time only, through gtk -> tray-icon of the desktop on Linux.
  { id = "RUSTSEC-2024-0370", reason = "build-time proc macro of the Linux tray (gtk), no runtime code" },
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
  "0BSD",
  "BSL-1.0",
  # notify (file watching of the plugins in development)
  "CC0-1.0",
]
# the crates of this workspace that are not published (xtask) have no license field
private = { ignore = true }
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
# the crates of the workspace depend on each other by path (no version): cargo-deny counts them as
# wildcards because the crates are not marked `publish = false`
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
