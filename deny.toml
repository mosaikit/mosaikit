# cargo-deny: known vulnerabilities (RustSec), licenses, sources of the dependencies.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Every exception says why it does not apply and when to drop it (docs/reports/dependencies.md).
ignore = [
  # proc-macro-error (unmaintained): build-time only, through gtk -> tray-icon of the desktop on Linux.
  { id = "RUSTSEC-2024-0370", reason = "build-time proc macro of the Linux tray (gtk), no runtime code" },
  # SQLite before 3.54.0 (bundled by libsqlite3-sys 0.30, through rusqlite 0.32 of mosaikit-db) can return uninitialised
  # memory when it opens a database together with a `-wal` file written by an untrusted party. The desktop profile opens
  # only the database its own server writes. The fix is libsqlite3-sys >= 0.39 (rusqlite 0.41), which `cargo` refuses:
  # `sqlx` (PostgreSQL only here) pulls `sqlx-sqlite`, which needs libsqlite3-sys < 0.38, and one package may link `sqlite3`.
  # Drop this when `sqlx` allows libsqlite3-sys 0.39, and in any case review it by 2026-12-09.
  { id = "RUSTSEC-2026-0459", reason = "the SQLite database is written only by its own server; the fix is blocked by sqlx-sqlite (links = sqlite3)" },
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
  "0BSD",
  "BSL-1.0",
  # notify (file watching of the plugins in development)
  "CC0-1.0",
]
# the crates of this workspace that are not published (xtask) have no license field
private = { ignore = true }
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
# the crates of the workspace depend on each other by path (no version): cargo-deny counts them as
# wildcards because the crates are not marked `publish = false`
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
