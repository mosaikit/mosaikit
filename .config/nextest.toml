# cargo-nextest settings (cargo xtask test uses nextest when it is installed).

[profile.default]
# a test still running after 60 s is reported as slow; after 5 minutes it is stopped
slow-timeout = { period = "60s", terminate-after = 5 }
# the run stops at the first failure only on request (--fail-fast); xtask passes --no-fail-fast
fail-fast = false

# The passes of `cargo xtask test`: same settings, JUnit results for tests/results/test-results.md
# (written to <target>/nextest/<profile>/junit.xml, copied to tests/results/raw).
[profile.pg.junit]
path = "junit.xml"

[profile.sqlite.junit]
path = "junit.xml"
