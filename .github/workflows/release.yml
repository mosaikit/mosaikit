name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

# mosaikit e mosaikit-plugins affiancati, come in locale
jobs:
  desktop-windows:
    runs-on: windows-latest
    env:
      MOSAIKIT_SIGNING_KEY: ${{ secrets.MOSAIKIT_SIGNING_KEY }}
    defaults:
      run:
        working-directory: mosaikit
    steps:
      - uses: actions/checkout@v4
        with:
          path: mosaikit
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/mosaikit-plugins
          path: mosaikit-plugins
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      # Mosaikit desktop usa SQLite: nessun PostgreSQL da includere
      - name: release desktop
        shell: pwsh
        run: cargo xtask release desktop
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            mosaikit/dist/*.zip
            mosaikit/dist/SHA256SUMS

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: mosaikit
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/mosaikit-plugins
          path: mosaikit-plugins
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: chiave di firma dei plugin
        run: printf '%s' "${{ secrets.MOSAIKIT_SIGNING_KEY }}" > signing.key
      # contesto: la cartella con mosaikit e mosaikit-plugins (vedi Dockerfile.dockerignore)
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: mosaikit/deploy/Dockerfile
          build-args: DIST=mosaikit
          push: true
          secret-files: signing_key=signing.key
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
