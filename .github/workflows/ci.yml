# SPDX-FileCopyrightText: 2026 Massimo Antonini
# SPDX-License-Identifier: MPL-2.0
#
# Pipeline: the same checks as `mvn verify` and `npm run verify` on a workstation, plus
# SonarQube, security scans and packaging. Images and actions are pinned by tag; Renovate proposes
# updates.
#
# A tag vX.Y.Z (see docs/development/release.md) also runs the release: version check, container image
# in GHCR, kernel-api and its parent POM in Maven Central, @mosaikit/sdk and @mosaikit/create-plugin
# in npmjs.org, the Helm
# chart in GHCR as an OCI artifact, and a GitHub release with the CHANGELOG section,
# the portable archives, the documents, the SBOM and the signed checksums attached.
#
# Run it by hand (Actions > CI > Run workflow) on the default branch to build the portable archives
# outside a release.

name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
  # The nightly lane: the slow tests and the analyses that pull requests skip.
  schedule:
    - cron: '17 2 * * *'

# A newer run of the same branch or pull request cancels this one, which saves compute minutes;
# the runs of a tag (the release) are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  MAVEN_OPTS: -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn
  MAVEN_CLI_OPTS: --batch-mode --errors --no-transfer-progress -Dspotless.apply.skip=true
  JAVA_VERSION: '25'
  NODE_VERSION: '24'
  HELM_VERSION: 4.3.0

jobs:
  # ---------------------------------------------------------------------------------------------
  # verify
  # ---------------------------------------------------------------------------------------------

  release-check:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Check the version and extract the release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          bash distribution/release/check-version.sh "$VERSION"
          bash distribution/release/release-notes.sh "$VERSION" > release-notes.md
          test -s release-notes.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-notes
          path: release-notes.md

  # Whether a pull request changes more than the documentation: one that changes only docs/ and the
  # Markdown files at the root skips the build of the kernel and the end-to-end tests (a skipped
  # job counts as passed for the required checks). Pushes and the nightly lane always run them.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          code=true
          if [[ "$EVENT" == pull_request ]]; then
            changed="$(git diff --name-only "$BASE_SHA"...HEAD)"
            if ! grep -qvE '^(docs/|[^/]+\.md$|LICENSE$)' <<<"$changed"; then
              code=false
            fi
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  # Lint, type check and unit tests of the frontend. The backend and the end-to-end tests build the
  # UI themselves, so the three jobs run at the same time.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --prefer-offline
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend
          path: |
            coverage/
            src/web/dist/
            src/plugins/*/dist/
          retention-days: 7

  # The documents of every commit (ADR-0023): Word and PDF guides, the compliance workbook, the
  # release overview and extended notes, zipped with their checksums. The checks that the Markdown
  # follows the code run in the frontend (docs/test) and backend (DocumentationTest) jobs.
  # On a tag the release job attaches the bundle.
  docs:
    # Nightly lane: not on pull requests.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    container: pandoc/extra:3.7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install the tools
        run: |
          apk add --no-cache python3 py3-openpyxl py3-yaml font-dejavu
          tlmgr install fvextra || true
      - name: Build the documents
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) VERSION="${GITHUB_REF_NAME#v}" ;;
            *) VERSION="$(echo "$GITHUB_SHA" | cut -c1-7)" ;;
          esac
          python3 docs/build/build.py --version "$VERSION" --output target/docs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docs
          path: target/docs/
          retention-days: 7

  # A pull request that changes the product also updates CHANGELOG.md (label no-changelog to skip;
  # after adding the label, re-run the job).
  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Check that CHANGELOG.md is updated
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: bash distribution/release/check-changelog.sh "$BASE_SHA"

  backend:
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # The tests start PostgreSQL from node_modules (EmbeddedPostgres): no Docker for them.
      - run: npm ci --prefer-offline
      # The UI that the kernel packages (the frontend job checks it at the same time).
      - run: npm run build
      # Pull requests run the fast lane: the installation tests (MK-011, minutes each) and the tests
      # with Keycloak (in Docker) run on main, every night and on tags. A pull request of
      # documentation only runs the test that the documentation follows the code.
      - name: Tests
        env:
          SLOW: ${{ github.event_name != 'pull_request' }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          if [[ "$CODE" != true ]]; then
            ./mvnw $MAVEN_CLI_OPTS -pl src/server -am test -Dskip.npm -Dtest=DocumentationTest -Dsurefire.failIfNoSpecifiedTests=false
          elif [[ "$SLOW" == true ]]; then
            ./mvnw $MAVEN_CLI_OPTS verify -Dskip.npm -Dtest.groups.excluded=
          else
            ./mvnw $MAVEN_CLI_OPTS verify -Dskip.npm -DskipITs
          fi
      - name: Test report
        if: always()
        uses: mikepenz/action-junit-report@3585e9575db828022551b4231f165eb59a0e74e3 # v5.6.2
        with:
          report_paths: '**/target/*-reports/TEST-*.xml'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend
          path: |
            sdk/java/target/site/jacoco/
            src/server/target/site/jacoco/
            src/server/target/jacoco-report/
            target/dist/
          retention-days: 7

  # End-to-end tests (tests/e2e/): an installation built here, at the same time as the backend job runs
  # the unit tests, started by its launcher on a PostgreSQL 18 of its own, driven in Chromium by
  # Playwright. Only the language model is a fake. A requirement is done when its e2e cases pass
  # here, not only its unit tests.
  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --prefer-offline
      # The UI, the SDK and the generator of plugins (for the tests of the devkit, MK-023).
      - run: npm run build
      # The installation and the catalog in target/dist, and the plugin API in the local repository.
      - run: ./mvnw $MAVEN_CLI_OPTS -T 1C install -DskipTests -Dskip.npm
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      # The suite starts its own PostgreSQL, from node_modules.
      - name: End-to-end tests
        run: npm run e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: e2e
          path: |
            tests/e2e/report/
            tests/e2e/.work/results/
            tests/e2e/.work/installation.log
            tests/e2e/.work/mail/
          retention-days: 7

  # ---------------------------------------------------------------------------------------------
  # quality
  # ---------------------------------------------------------------------------------------------

  # Runs once the secret SONAR_TOKEN is defined (Settings > Secrets and variables > Actions). The
  # scanner targets SonarQube Cloud; the variable SONAR_HOST_URL points it to a SonarQube Server
  # instead. The variables SONAR_ORGANIZATION and SONAR_PROJECT_KEY override the keys of the root
  # pom.xml. Pull requests from forks get no secrets, so the analysis is skipped there.
  sonarqube:
    needs: [backend, frontend]
    # Nightly lane: not on pull requests (the analysis of main keeps the quality gate).
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST: ${{ vars.SONAR_HOST_URL }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
    steps:
      - name: Skip without SONAR_TOKEN
        if: env.SONAR_TOKEN == ''
        run: echo "::notice::SONAR_TOKEN is not defined, the analysis is skipped."
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: env.SONAR_TOKEN != ''
        with:
          # The analysis needs the whole history to find new code and the branch a pull request
          # targets.
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        if: env.SONAR_TOKEN != ''
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: env.SONAR_TOKEN != ''
        with:
          name: frontend
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: env.SONAR_TOKEN != ''
        with:
          name: backend
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: env.SONAR_TOKEN != ''
        with:
          path: ~/.sonar/cache
          key: sonar-${{ github.run_id }}
          restore-keys: sonar-
      - name: Analysis
        if: env.SONAR_TOKEN != ''
        run: |
          # Vitest writes paths relative to the repository root; the scanner resolves them from each
          # Maven module, so they are made absolute.
          sed -i "s#^SF:#SF:$GITHUB_WORKSPACE/#" coverage/lcov.info
          ./mvnw $MAVEN_CLI_OPTS -DskipTests -Dskip.npm verify \
            org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.qualitygate.wait=true \
            ${SONAR_HOST:+-Dsonar.host.url=$SONAR_HOST} \
            ${SONAR_ORGANIZATION:+-Dsonar.organization=$SONAR_ORGANIZATION} \
            ${SONAR_PROJECT_KEY:+-Dsonar.projectKey=$SONAR_PROJECT_KEY}

  # ---------------------------------------------------------------------------------------------
  # security
  # ---------------------------------------------------------------------------------------------

  secrets:
    runs-on: ubuntu-latest
    container: zricethezav/gitleaks:v8.30.1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The whole history: in a shallow clone the oldest commit looks as if it added every file,
          # so a finding reviewed in .gitleaksignore would come back under a different commit on
          # every push.
          fetch-depth: 0
      - run: gitleaks detect --source . --no-banner --redact --verbose

  sast:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.175.0
      options: --user root
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Semgrep
        run: |
          # The image expects the code mounted in /src when run with docker run; in CI the code is
          # in the job directory, so the Docker mode is turned off and the target is given explicitly.
          unset SEMGREP_IN_DOCKER
          semgrep scan --config p/java --config p/typescript --config p/owasp-top-ten --error \
            --metrics off .

  # ---------------------------------------------------------------------------------------------
  # package
  # ---------------------------------------------------------------------------------------------

  sbom:
    # Nightly lane: not on pull requests.
    if: github.event_name != 'pull_request'
    needs: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - run: >-
          ./mvnw $MAVEN_CLI_OPTS -DskipTests -Dskip.npm package
          org.cyclonedx:cyclonedx-maven-plugin:makeAggregateBom
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: target/sbom.json

  # After sbom: the Java dependencies are read from its CycloneDX file, already resolved with the
  # Maven cache. Letting Trivy resolve the pom.xml files itself downloads every parent POM from
  # Maven Central, which rate-limits shared runners (429 Too Many Requests).
  dependency-scan:
    needs: sbom
    runs-on: ubuntu-latest
    # Pin by digest before production use: Trivy's supply chain was compromised in March 2026.
    container: aquasec/trivy:0.74.0
    env:
      TRIVY_CACHE_DIR: .trivy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sbom
          path: target
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .trivy
          key: trivy-${{ github.run_id }}
          restore-keys: trivy-
      - name: Scan
        run: |
          # npm dependencies (package-lock.json), secrets and licenses of the sources.
          trivy fs --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed \
            --scanners vuln,secret,license --skip-files '**/pom.xml' --skip-dirs .trivy .
          # Java dependencies of the kernel and the plugins.
          trivy sbom --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed target/sbom.json

  container-image:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [backend, e2e, release-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: backend
      - id: image
        name: Image name and timestamp
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Reproducible: every timestamp in the layers is set to the time of the tagged commit.
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        env:
          SOURCE_DATE_EPOCH: ${{ steps.image.outputs.epoch }}
        with:
          context: .
          file: distribution/docker/Containerfile
          tags: ${{ steps.image.outputs.name }}:${{ github.ref_name }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          outputs: type=registry,rewrite-timestamp=true

  portable:
    needs: backend
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref_name == github.event.repository.default_branch)
    continue-on-error: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux-x64, windows-x64, macos-arm64, macos-x64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: backend
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: target/portable-cache/
          key: portable-${{ matrix.platform }}-${{ github.run_id }}
          restore-keys: portable-${{ matrix.platform }}-
      - name: Build the portable archive
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          distribution/portable/build.sh "$PLATFORM" target/portable
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # The archives take the name of the tag before the checksums are computed, so that the
            # names in SHA256SUMS match the files attached to the release:
            # mosaikit-portable-vX.Y.Z-<platform>.
            VERSION="${GITHUB_REF_NAME#v}"
            for file in target/portable/mosaikit-portable-*; do
              base="$(basename "$file")"
              name="${base/#mosaikit-portable-$VERSION-/mosaikit-portable-$GITHUB_REF_NAME-}"
              [ "$base" = "$name" ] || mv "$file" "target/portable/$name"
            done
          fi
          (cd target/portable && sha256sum mosaikit-portable-* > "SHA256SUMS-$PLATFORM")
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: portable-${{ matrix.platform }}
          path: |
            target/portable/mosaikit-portable-*
            target/portable/SHA256SUMS-*
          retention-days: 7

  portable-test:
    needs: portable
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref_name == github.event.repository.default_branch)
    continue-on-error: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: portable-linux-x64
          path: target/portable
      - name: MK-016 acceptance test on the Linux archive, as a user would run it
        run: |
          ARCHIVE="$(ls target/portable/mosaikit-portable-*-linux-x64.tar.gz)"
          ./mvnw $MAVEN_CLI_OPTS -pl src/server -am verify -Dskip.npm \
            -Dtest=none -Dsurefire.failIfNoSpecifiedTests=false \
            -Dit.test=PortableDistributionIT -Dfailsafe.failIfNoSpecifiedTests=false \
            -Dmosaikit.it.portable="$GITHUB_WORKSPACE/$ARCHIVE"

  # ---------------------------------------------------------------------------------------------
  # release
  # ---------------------------------------------------------------------------------------------

  # Maven Central (Central Portal). The release profile of the root pom.xml adds what Central
  # requires (sources, Javadoc, GPG signatures) and the central-publishing-maven-plugin, which
  # uploads the bundle and waits until it is published. The secrets live in the environment
  # "release" (or at the organization level, restricted to the repositories that publish).
  publish-maven:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [backend, e2e, release-check]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # setup-java writes a settings.xml with the server "central" and imports the signing key.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: backend
      - name: Deploy kernel-api and the parent POM to Maven Central
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          # The parent POM is published with kernel-api because plugin builds need it to resolve the
          # API.
          ./mvnw $MAVEN_CLI_OPTS -Prelease -DskipTests -Dskip.npm -pl .,sdk/java deploy

  # npmjs.org with trusted publishing (OIDC): no token to keep, and npm attaches the provenance
  # attestation by itself. On npmjs.com the package declares this repository, the workflow ci.yml
  # and the environment "release" as its trusted publisher.
  publish-npm:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [frontend, e2e, release-check]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # No registry-url: setup-node would write a placeholder token that hides the OIDC exchange.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install --global npm@11
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: frontend
      - run: npm ci --prefer-offline
      - run: npm run build -w sdk/js -w sdk/create-plugin
      - name: Publish @mosaikit/sdk and @mosaikit/create-plugin
        run: |
          # Pre-releases (v1.2.0-rc.1) are published under the "next" dist-tag, not "latest".
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then TAG=next; else TAG=latest; fi
          npm publish -w sdk/js -w sdk/create-plugin --tag "$TAG" --access public

  publish-helm:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [e2e, release-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Helm
        run: |
          # Helm is downloaded at a pinned version and checked against its published checksum.
          ARCHIVE="helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          curl --fail --silent --show-error --location --remote-name "https://get.helm.sh/${ARCHIVE}"
          curl --fail --silent --show-error --location --remote-name "https://get.helm.sh/${ARCHIVE}.sha256sum"
          sha256sum --check "${ARCHIVE}.sha256sum"
          tar -xzf "$ARCHIVE" linux-amd64/helm
      - name: Package and push the chart to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          linux-amd64/helm lint distribution/k8s/mosaikit
          linux-amd64/helm package distribution/k8s/mosaikit
          echo "$GITHUB_TOKEN" | linux-amd64/helm registry login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin
          linux-amd64/helm push "mosaikit-${GITHUB_REF_NAME#v}.tgz" \
            "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"

  # Signatures of the release without keys to keep (NC-22): cosign signs the container image and
  # the checksums of the archives and documents with the OIDC identity of this workflow (Sigstore
  # keyless); anyone verifies them with cosign verify / verify-blob, the identity
  # https://github.com/<owner>/<repo>/.github/workflows/ci.yml@refs/tags/<tag> and the issuer
  # https://token.actions.githubusercontent.com.
  sign:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [container-image, portable, docs]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: portable-*
          path: target/portable
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: docs
          path: target/docs
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Sign the image and the checksums
        env:
          IMAGE: ${{ needs.container-image.outputs.image }}
          DIGEST: ${{ needs.container-image.outputs.digest }}
        run: |
          # By digest: the signature covers exactly the image that was built.
          cosign sign --yes "$IMAGE@$DIGEST"
          mkdir -p target/signatures
          cat target/portable/SHA256SUMS-* target/docs/SHA256SUMS > target/signatures/SHA256SUMS
          cosign sign-blob --yes --bundle target/signatures/SHA256SUMS.sigstore.json \
            target/signatures/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signatures
          path: target/signatures/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - release-check
      - sbom
      - container-image
      - portable
      - portable-test
      - publish-maven
      - publish-npm
      - publish-helm
      - docs
      - sign
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-notes
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: portable-*
          path: target/portable
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: docs
          path: target/docs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: signatures
          path: target/signatures
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sbom
          path: target
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ needs.container-image.outputs.image }}
          TAG: ${{ github.ref_name }}
        run: |
          {
            echo
            echo "## Packages"
            echo
            echo "- Container image: \`$IMAGE:$TAG\`"
            echo "- Helm chart: \`oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts/mosaikit\`, version ${TAG#v}"
            echo "- kernel-api and its parent POM: Maven Central, version ${TAG#v}"
            echo "- @mosaikit/sdk: https://www.npmjs.com/package/@mosaikit/sdk/v/${TAG#v}"
            echo "- @mosaikit/create-plugin: \`npx @mosaikit/create-plugin@${TAG#v}\`"
            echo
            echo "The checksums of the archives and documents are signed with Sigstore. Verify them with:"
            echo
            echo '```'
            echo "cosign verify-blob --bundle SHA256SUMS.sigstore.json \\"
            echo "  --certificate-identity $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/ci.yml@refs/tags/$TAG \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com SHA256SUMS"
            echo "sha256sum --check --ignore-missing SHA256SUMS"
            echo '```'
          } >> release-notes.md
          cp target/sbom.json "mosaikit-$TAG-sbom.cdx.json"
          PRERELEASE=()
          if [[ "$TAG" == *-* ]]; then PRERELEASE=(--prerelease); fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Mosaikit $TAG" --notes-file release-notes.md "${PRERELEASE[@]}" \
            target/portable/mosaikit-portable-* \
            target/docs/mosaikit-docs-*.zip \
            target/signatures/SHA256SUMS \
            target/signatures/SHA256SUMS.sigstore.json \
            "mosaikit-$TAG-sbom.cdx.json"
