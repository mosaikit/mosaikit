# =============================================================================
#  brand.toml - brand of the product
# =============================================================================
#  Mosaikit uses these values for the page title, the sign-in, the status bar,
#  the notification area (desktop) and the colours of the theme. A distribution
#  based on Mosaikit has its own `branding/` folder with this file and the
#  images it names. Every property is optional.
#  The files (logo, favicon, icon) are file names in this folder.
# =============================================================================

# Name of the product.
name = "Mosaikit"

# Version shown to users (default: the version of Mosaikit).
# version = "1.0.0"

# Phrase under the name on the sign-in page.
tagline = "apps, data and sharing for every tenant"

# Message on the sign-in page (e.g. whom to ask for an account).
# login_message = "For an account write to support@example.com"

# Text at the foot of the sign-in page (default: the name).
# footer = "© 2026 Example Inc."

# Support or documentation address.
# support_url = "https://example.com/support"

# Logo (svg, png or webp; recommended height 64 px). Default: the Mosaikit symbol.
# logo = "logo.svg"

# Favicon of the browser (svg, png or ico).
# favicon = "favicon.svg"

# Icon for the notification area and the desktop executable (.ico with 16-256 px).
# icon = "icon.ico"

# Colours of the theme (#rrggbb only). The transparent variants of the accent are
# computed from `accent`. The plugin UIs receive the same colours.
[colors]
# accent = "#f0b23e"  # accent: buttons, selection, charts
# bg     = "#0b0c0f"  # background of the page
# panel  = "#14161b"  # panels and cards
# panel2 = "#1b1e24"  # secondary panels
# line   = "#2a2e37"  # borders
# fg     = "#ece7db"  # text
# dim    = "#8f887a"  # secondary text
# ok     = "#5cb887"  # positive outcome
# err    = "#e0615c"  # errors
