id: dev.mosaikit.sample.activities
version: 0.1.0
name: Activities (sample)
description: >-
  Sample app of the prototype: activities of an organization, with a data contract, an extension
  point for widgets of other plugins and actions for assistants (MK-020).
kind: [app, service]
platform: '>=0.1 <1'
backend:
  jar: lib/sample-activities.jar
  api: sample-activities
database:
  schema: p_sample_activities
frontend:
  entry: web/index.js
  isolation: module
  # Other plugins contribute widgets shown with each activity; attribute "element" names the
  # custom element, which receives the activity in its "activity-id" attribute.
  points: [activities.detail]
  bridge:
    publishes: [activities.*]
    subscribes: [estimates.*]
    services: [api]
actions:
  - name: list-activities
    title: List activities
    description: Lists the activities of the organization, oldest first, with whether they are done.
    risk: read
    call:
      method: GET
      path: activities
  - name: create-activity
    title: Create an activity
    description: Adds an activity to the organization.
    risk: write
    input:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
      required: [title]
      additionalProperties: false
    call:
      method: POST
      path: activities
  - name: complete-activity
    title: Complete an activity
    description: Marks an activity of the organization as done.
    risk: write
    input:
      type: object
      properties:
        id:
          type: string
          format: uuid
      required: [id]
      additionalProperties: false
    call:
      method: POST
      path: activities/{id}/completion
contributes:
  # The app bar of the shell (MK-025).
  rail.app:
    - id: activities
      title: Activities
      route: /app/activities
      element: mk-sample-activities
      icon: web/icon.svg
      order: 20
