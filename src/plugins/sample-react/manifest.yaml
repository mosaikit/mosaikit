id: dev.mosaikit.sample.react
version: 0.1.0
name: Palette (React sample)
description: >-
  Sample app written with React (MK-021): picks a colour, publishes it on the bus and shows the
  previews that other plugins contribute, such as the Vue sample.
kind: [app]
platform: '>=0.1 <1'
frontend:
  entry: dist/index.js
  isolation: module
  points: [palette.preview]
  bridge:
    publishes: [palette.*]
contributes:
  # The app bar of the shell (MK-025).
  rail.app:
    - id: palette
      title: Palette
      route: /app/palette
      element: mk-sample-palette
      icon: web/icon.svg
      order: 80
