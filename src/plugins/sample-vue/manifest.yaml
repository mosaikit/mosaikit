id: dev.mosaikit.sample.vue
version: 0.1.0
name: Swatch (Vue sample)
description: >-
  Sample extension written with Vue (MK-021): a swatch shown in the Palette app, which follows the
  colour that the React sample publishes on the bus.
kind: [extension]
platform: '>=0.1 <1'
requires:
  dev.mosaikit.sample.react: '^0.1'
frontend:
  entry: dist/index.js
  isolation: module
  bridge:
    subscribes: [palette.*]
contributes:
  palette.preview:
    - id: swatch
      element: mk-sample-swatch
