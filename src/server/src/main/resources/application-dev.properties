#
# Development mode only (./mvnw -pl kernel quarkus:dev). A fixed, documented password for the
# local administrator, never used by an installation: they generate their own. Kept in this file
# so that the secret scanners can accept it without ignoring application.properties.
mosaikit.bootstrap.admin-password=admin-dev-only
# A patterned master key for the store of credentials (MK-062), for development only: an
# installation generates its own (openssl rand -base64 32).
mosaikit.secrets.master-key=3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d0=
