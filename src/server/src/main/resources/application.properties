quarkus.application.name=mosaikit

# --- Security ------------------------------------------------------------------
# Local accounts are verified by LocalIdentityProvider with HTTP Basic. Organizations with a
# Keycloak realm sign in with bearer tokens of their realm (MK-012, ADR-0011): each realm is an
# OIDC tenant created on first use by OrganizationTenantResolver, so the default tenant is off and
# the kernel never contacts Keycloak at start.
quarkus.http.auth.basic=true
# The shell signs local accounts in once, with a form: the kernel answers with an encrypted,
# HttpOnly session cookie (SessionResource), so that a reload keeps the session and no script holds
# the password. The empty pages turn the redirects of form authentication into status codes. Set
# quarkus.http.auth.session.encryption-key when several kernels serve the same installation.
quarkus.http.auth.form.enabled=true
quarkus.http.auth.form.post-location=/api/v1/accounts/session
quarkus.http.auth.form.username-parameter=username
quarkus.http.auth.form.password-parameter=password
quarkus.http.auth.form.login-page=
quarkus.http.auth.form.error-page=
quarkus.http.auth.form.landing-page=
quarkus.http.auth.form.cookie-name=mosaikit-session
quarkus.http.auth.form.http-only-cookie=true
quarkus.http.auth.form.cookie-same-site=strict
quarkus.http.auth.form.timeout=PT8H
quarkus.oidc.tenant-enabled=false
quarkus.keycloak.devservices.enabled=false
# Tests and npm run dev start their own embedded PostgreSQL: Quarkus must not start one in Docker.
quarkus.datasource.devservices.enabled=false
quarkus.http.header."X-Content-Type-Options".value=nosniff
quarkus.http.header."X-Frame-Options".value=DENY
quarkus.http.header."Referrer-Policy".value=no-referrer
%prod.quarkus.http.header."Strict-Transport-Security".value=max-age=31536000; includeSubDomains
# The UI exchanges the authorization code at the token endpoint of Keycloak, hence connect-src.
# Isolated plugin frontends (MK-014) are srcdoc iframes that inherit this policy: they load scripts
# from the kernel only, and form-action 'none' keeps their forms from sending data elsewhere.
# Inline styles are allowed: plugins style their custom elements with <style> in their shadow DOM.
%prod.quarkus.http.header."Content-Security-Policy".value=default-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' ${mosaikit.identity.keycloak-url:}; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'
# Plugin APIs live under /api/v1/p/<plugin>; they are never anonymous, whatever the plugin declares.
quarkus.http.auth.permission.plugin-api.paths=/api/v1/p/*
quarkus.http.auth.permission.plugin-api.policy=authenticated

# --- Persistence ---------------------------------------------------------------
# In dev and test mode Dev Services start PostgreSQL in a container.
# In production set QUARKUS_DATASOURCE_JDBC_URL, _USERNAME and _PASSWORD.
quarkus.datasource.db-kind=postgresql
# Lets Hibernate use the PostgreSQL 18 dialect features instead of its conservative default.
quarkus.datasource.db-version=18
quarkus.hibernate-orm.database.default-schema=mk_kernel
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=mk_kernel
quarkus.flyway.locations=db/kernel

# --- Packaging -------------------------------------------------------------------
# Mutable JAR with a providers directory: the mosaikit launcher copies the JARs of Java plugins there and
# rebuilds the kernel at the next start (MK-011, ADR-0004), as Keycloak does for its providers.
quarkus.package.jar.type=mutable-jar
quarkus.package.jar.user-providers-directory=providers
# The re-augmentation looks for providers in <parent>/<output-directory>/providers, so the kernel
# directory of an installation must have this name.
quarkus.package.output-directory=kernel

# --- API documentation -----------------------------------------------------------
quarkus.smallrye-openapi.info-title=Mosaikit kernel API
quarkus.smallrye-openapi.info-license-name=MPL-2.0
quarkus.smallrye-openapi.info-license-url=https://mozilla.org/MPL/2.0/

# --- Kernel UI ---------------------------------------------------------------------
# The UI (src/web) is built by npm before the kernel and packaged in it under mosaikit-ui/,
# where UserInterfaceRoutes serves it; rebuilding the kernel for a Java plugin never needs Node.js.
# In development mode Quinoa serves the UI sources with live reload instead.
quarkus.quinoa=false
%dev.quarkus.quinoa=true
quarkus.quinoa.ui-dir=../web
quarkus.quinoa.build-dir=dist
quarkus.quinoa.enable-spa-routing=true
quarkus.quinoa.ignored-path-prefixes=/api,/q,/mcp
quarkus.quinoa.package-manager-install=true
quarkus.quinoa.package-manager-install.node-version=24.21.0

# --- Kernel ----------------------------------------------------------------------
mosaikit.plugins.directory=plugins
%dev.mosaikit.plugins.directory=../plugins
%test.mosaikit.plugins.directory=src/test/resources/plugins
# The development-mode administrator password is in application-dev.properties.
%test.mosaikit.bootstrap.admin-password=test-admin-password
# The plugins of development and tests are directories, whose publisher is never verified: load
# their frontends as modules there; installations isolate them (MK-014).
%dev.mosaikit.plugins.unverified-frontends=module
%test.mosaikit.plugins.unverified-frontends=module
%dev.mosaikit.plugins.watch=true

# Mails to people (the confirmation of a registration). Set the server of the installation with
# quarkus.mailer.host, port, username, password and tls; npm run dev and the end-to-end tests use
# the fake server of sdk/testing/src/smtp.ts, the Quarkus tests the mock mailbox.
quarkus.mailer.from=Mosaikit <no-reply@localhost>
quarkus.mailer.mock=false
%test.quarkus.mailer.mock=true
# The Quarkus tests register people and sign in at once; RegistrationTest turns the confirmation on.
%test.mosaikit.accounts.confirm-email=false
