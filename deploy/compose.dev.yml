# PostgreSQL di sviluppo via Docker (usato da `cargo xtask db up` se PostgreSQL non e'
# installato localmente). Stessa porta e credenziali del cluster locale.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:55432:5432"
    command: ["postgres", "-c", "max_connections=300"]
    volumes:
      - devpg:/var/lib/postgresql/data
      - ./initdb-dev:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  devpg:
