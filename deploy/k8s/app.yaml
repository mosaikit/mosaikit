# {{name}}: one instance of the app with a persistent volume for uploaded files and plugin
# packages (/data). A single replica: the contents are on the volume (ReadWriteOnce);
# sessions and data are in the database. "Recreate" update: the old instance
# stops before the new one starts (the migrations run at start).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{id}}-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: {{id}}
  labels:
    app.kubernetes.io/name: {{id}}
spec:
  selector:
    app.kubernetes.io/name: {{id}}
  ports:
    # app: UI and API
    - name: app
      port: 8080
      targetPort: app
    # plugin UIs, uploaded files and public links (separate origin)
    - name: plugins
      port: 8081
      targetPort: plugins
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{id}}
  labels:
    app.kubernetes.io/name: {{id}}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{id}}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{id}}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: app
          image: {{image}}
          ports:
            - name: app
              containerPort: 8080
            - name: plugins
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: {{id}}-config
          env:
            - name: MOSAIKIT_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{id}}-secret
                  key: MOSAIKIT_DB_PASSWORD
            - name: MOSAIKIT_DATABASE_URL
              value: postgres://mosaikit_app:$(MOSAIKIT_DB_PASSWORD)@{{id}}-postgres:5432/mosaikit
            # initial password of admin (tenant system): used only at the first start
            - name: MOSAIKIT_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{id}}-secret
                  key: MOSAIKIT_ADMIN_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /data
          # health: /api/health under the base path of MOSAIKIT_URL (as in the Dockerfile)
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - p=$(printf '%s' "${MOSAIKIT_URL:-}" | sed -E 's#^[a-z]+://[^/]*##; s#/$##'); curl -fsS "http://127.0.0.1:8080${p}/api/health"
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - p=$(printf '%s' "${MOSAIKIT_URL:-}" | sed -E 's#^[a-z]+://[^/]*##; s#/$##'); curl -fsS "http://127.0.0.1:8080${p}/api/health"
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - p=$(printf '%s' "${MOSAIKIT_URL:-}" | sed -E 's#^[a-z]+://[^/]*##; s#/$##'); curl -fsS "http://127.0.0.1:8080${p}/api/health"
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{id}}-data
