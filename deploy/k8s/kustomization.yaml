# {{name}} {{version}} on Kubernetes (kustomize). Installation:
#   1. edit config.env (addresses) and secret.env (passwords)
#   2. set the image below (a registry the cluster can reach)
#   3. edit the hostnames in ingress.yaml
#   4. kubectl apply -k .
# Details in README.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: {{id}}

labels:
  - pairs:
      app.kubernetes.io/part-of: {{id}}
    includeSelectors: false

resources:
  - namespace.yaml
  - postgres.yaml
  - app.yaml
  - ingress.yaml

# public addresses and options of the app (not secret)
configMapGenerator:
  - name: {{id}}-config
    envs:
      - config.env
  # first initialization script of the database (application role, PostGIS)
  - name: {{id}}-postgres-initdb
    files:
      - initdb/01-mosaikit.sh

# passwords: in production better a secret manager (Sealed Secrets, External Secrets...)
secretGenerator:
  - name: {{id}}-secret
    envs:
      - secret.env

# image of the app: push it to a registry the cluster can reach and write it here
images:
  - name: {{image}}
    newName: {{image}}
    newTag: "{{version}}"
  - name: postgres-image
    newName: {{postgres_repo}}
    newTag: "{{postgres_tag}}"
