# Two hostnames, two origins: the app and plugins/contents/public links must be on
# different origins (security: the code of the plugins does not see the cookies of the app).
# Replace the hostnames and align config.env (MOSAIKIT_URL, MOSAIKIT_PLUGIN_URL).
# With cert-manager the certificates are obtained by adding the annotation of its issuer.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{id}}
  annotations:
    # uploads of files and plugin packages (ingress-nginx)
    nginx.ingress.kubernetes.io/proxy-body-size: "256m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    # cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - {{id}}.example.com
        - plugins.{{id}}.example.com
      secretName: {{id}}-tls
  rules:
    - host: {{id}}.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{id}}
                port:
                  name: app
    - host: plugins.{{id}}.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{id}}
                port:
                  name: plugins
