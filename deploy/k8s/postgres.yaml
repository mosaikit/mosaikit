# PostgreSQL di {{name}}: un'istanza con volume persistente. Al primo avvio lo script
# initdb crea il ruolo applicativo (non superutente, con CREATEROLE per i ruoli dei
# plugin), il database e, se l'immagine lo include, PostGIS.
# In alternativa si puo' usare un PostgreSQL gestito: vedi README.md.
apiVersion: v1
kind: Service
metadata:
  name: {{id}}-postgres
  labels:
    app.kubernetes.io/name: {{id}}-postgres
spec:
  selector:
    app.kubernetes.io/name: {{id}}-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{id}}-postgres
  labels:
    app.kubernetes.io/name: {{id}}-postgres
spec:
  serviceName: {{id}}-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{id}}-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{id}}-postgres
    spec:
      containers:
        - name: postgres
          image: postgres-image
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{id}}-secret
                  key: POSTGRES_PASSWORD
            - name: MOSAIKIT_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{id}}-secret
                  key: MOSAIKIT_DB_PASSWORD
            # sottocartella: la radice di un volume puo' contenere lost+found
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "mosaikit"]
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: initdb
          configMap:
            name: {{id}}-postgres-initdb
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
