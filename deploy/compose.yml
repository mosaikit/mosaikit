# Server di una distribuzione Mosaikit + PostgreSQL.
#   cargo xtask release docker                 # costruisce l'immagine mosaikit:<versione>
#   MOSAIKIT_VERSION=1.0.0 docker compose -f deploy/compose.yml up -d
# Una distribuzione (eventualmente con PostGIS):
#   MOSAIKIT_IMAGE=prodotto POSTGRES_IMAGE=postgis/postgis:17-3.5-alpine docker compose ... up -d
# App:   http://localhost:8080   (tenant system, utente admin, password MOSAIKIT_ADMIN_PASSWORD)
# Plugin e contenuti: http://localhost:8081
# In produzione metti un reverse proxy HTTPS davanti con DUE hostname
# (es. gis.esempio.it -> 8080, plugins.esempio.it -> 8081) e imposta MOSAIKIT_URL
# (anche con un percorso base, es. https://gis.esempio.it/mosaikit) e MOSAIKIT_PLUGIN_URL.

services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambia-questa-password}
      MOSAIKIT_DB_PASSWORD: ${MOSAIKIT_DB_PASSWORD:-cambia-anche-questa}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mosaikit"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    image: ${MOSAIKIT_IMAGE:-mosaikit}:${MOSAIKIT_VERSION:-1.0.0}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      MOSAIKIT_DATABASE_URL: postgres://mosaikit_app:${MOSAIKIT_DB_PASSWORD:-cambia-anche-questa}@db:5432/mosaikit
      MOSAIKIT_ADMIN_PASSWORD: ${MOSAIKIT_ADMIN_PASSWORD:-cambiami-subito}
      # indirizzo pubblico dell'app, con l'eventuale percorso base
      MOSAIKIT_URL: ${MOSAIKIT_URL:-http://localhost:8080}
      # UI dei plugin, file e link pubblici: un'origine diversa (altro host o porta)
      MOSAIKIT_PLUGIN_URL: ${MOSAIKIT_PLUGIN_URL:-http://localhost:8081}
      # dietro un reverse proxy: usa X-Forwarded-For per il limite ai tentativi di login
      MOSAIKIT_TRUST_PROXY: ${MOSAIKIT_TRUST_PROXY:-false}
    ports:
      - "${MOSAIKIT_HTTP_PORT:-8080}:8080"
      - "${MOSAIKIT_PLUGIN_PORT:-8081}:8081"
    volumes:
      - appdata:/data

volumes:
  pgdata:
  appdata:
