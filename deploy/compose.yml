# Server of a Mosaikit distribution + PostgreSQL.
#   cargo xtask release docker                 # builds the image mosaikit:<version>
#   MOSAIKIT_VERSION=1.0.0 docker compose -f deploy/compose.yml up -d
# A distribution (possibly with PostGIS):
#   MOSAIKIT_IMAGE=product POSTGRES_IMAGE=postgis/postgis:17-3.5-alpine docker compose ... up -d
# App:   http://localhost:8080   (tenant system, user admin, password MOSAIKIT_ADMIN_PASSWORD)
# Plugins and contents: http://localhost:8081
# In production put an HTTPS reverse proxy in front with TWO hostnames
# (e.g. gis.example.com -> 8080, plugins.example.com -> 8081) and set MOSAIKIT_URL
# (with a base path too, e.g. https://gis.example.com/mosaikit) and MOSAIKIT_PLUGIN_URL.

services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambia-questa-password}
      MOSAIKIT_DB_PASSWORD: ${MOSAIKIT_DB_PASSWORD:-cambia-anche-questa}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mosaikit"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    image: ${MOSAIKIT_IMAGE:-mosaikit}:${MOSAIKIT_VERSION:-1.0.0}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      MOSAIKIT_DATABASE_URL: postgres://mosaikit_app:${MOSAIKIT_DB_PASSWORD:-cambia-anche-questa}@db:5432/mosaikit
      MOSAIKIT_ADMIN_PASSWORD: ${MOSAIKIT_ADMIN_PASSWORD:-cambiami-subito}
      # public address of the app, with an optional base path
      MOSAIKIT_URL: ${MOSAIKIT_URL:-http://localhost:8080}
      # plugin UIs, files and public links: a different origin (another host or port)
      MOSAIKIT_PLUGIN_URL: ${MOSAIKIT_PLUGIN_URL:-http://localhost:8081}
      # behind a reverse proxy: use X-Forwarded-For for the limit on sign-in attempts
      MOSAIKIT_TRUST_PROXY: ${MOSAIKIT_TRUST_PROXY:-false}
    ports:
      - "${MOSAIKIT_HTTP_PORT:-8080}:8080"
      - "${MOSAIKIT_PLUGIN_PORT:-8081}:8081"
    volumes:
      - appdata:/data

volumes:
  pgdata:
  appdata:
