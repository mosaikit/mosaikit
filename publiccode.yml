developmentStatus: development
softwareType: 'standalone/web'

description:
  en:
    shortDescription: >-
      Domain-agnostic extension platform for multi-organization web applications.
    longDescription: >-
      Mosaikit provides a small kernel with identity, organizations, users, localization,
      theming and extension management. Every product feature is an extension that can extend the
      user interface, the backend API and the database schema, and can itself be extended by
      other extensions. It ships as a portable application, a container image and a Helm chart
      for SaaS and on-premises deployments. This description is a placeholder and will be
      extended before the first release, as required by the publiccode.yml specification.
    features:
      - Extension system with frontend, backend and database extensions
      - Multi-organization identity with local accounts and federation
      - Extension marketplace with signed packages

