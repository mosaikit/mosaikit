id: MK-031
title: Real-time channel from the kernel to the browser
area: kernel
priority: P1
status: done
description: >-
  The shell keeps one WebSocket to the kernel for the active organization; extensions subscribe to
  topics and receive events committed by any request, through PostgreSQL LISTEN/NOTIFY, which
  every kernel of an installation shares; a NATS implementation of the same bus comes for clusters
  under load. See ADR-0028 and ADR-0033.
acceptance:
  - An event published by an extension after a commit reaches every subscribed page of the people allowed to read it within one second on one node.
  - A subscription to a topic that the person may not read is refused.
  - The bus is behind an interface, so that NATS can replace PostgreSQL for clusters without changes to extensions.
depends: [MK-009, MK-019]
