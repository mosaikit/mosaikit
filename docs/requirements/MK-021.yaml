id: MK-021
title: Extension frontends written with any framework
area: shell
priority: P1
status: done
verified-in: mosaikit/mosaikit-samples
description: >-
  An extension frontend may be written with a framework such as React or Vue, bundled with it into one
  ES module, and shares the page, the theme, the language and the event bus with the others. The
  React and Vue samples show two frameworks in the same page. Prototype spike S2. See ADR-0020.
acceptance:
  - A React extension and a Vue extension run in the same page, the Vue one as a widget in an extension point of the React one.
  - The Vue extension receives on the event bus the selection that the React extension publishes.
  - Both follow the theme tokens and the language of the shell.
depends: [MK-008, MK-009, MK-020]
