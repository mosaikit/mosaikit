id: MK-002
title: Manage organizations
area: kernel
priority: P1
status: done
description: >-
  The organization is the unit of isolation for people, data and enabled extensions. The platform
  administrator creates and lists organizations.
acceptance:
  - Only a platform administrator can list, read and create organizations.
  - The slug is unique, lowercase, made of letters, digits and inner hyphens.
  - A duplicate slug is refused with 409 and an invalid request with 400, both as problem details.
depends: [MK-003, MK-010]
