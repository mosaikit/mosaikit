id: MK-035
title: Tabs of the channels added by extensions
area: extensions
priority: P1
status: done
verified-in: mosaikit/mosaikit-samples
description: >-
  Every channel of app-teams has the tabs Posts and Files and the tabs that other extensions add
  through its extension point channel.tab, such as a map or a dashboard bound to the channel. The
  tab Files shows the files of the channel once the file service is there (MK-042).
acceptance:
  - A member adds a tab of an installed extension to a channel and every member sees it.
  - A tab of an extension that is disabled for the organization is shown as unavailable instead of breaking the channel.
depends: [MK-020, MK-034]
