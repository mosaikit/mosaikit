id: MK-049
title: Repository laid out by role, with the sources under src/
area: kernel
priority: P1
status: done
description: >-
  The repository says at first sight where each thing is. The code that runs is under src/: the
  server (src/server, the Quarkus kernel and the launcher), the web shell (src/web) and the sample
  plugins (src/plugins). Beside it stand what third parties use (sdk/), how Mosaikit is delivered
  (distribution/), the tests that need a whole installation (tests/e2e), the scripts of development
  (build/) and the documentation (docs/, with docs/guide for who runs Mosaikit and
  docs/development for who changes it). The folders of an installation (plugins/, bin/kernel/)
  do not change.
acceptance:
  - The build, the frontend checks and the end-to-end tests run from the new folders.
  - The old top-level folders (kernel, plugins, distributions, e2e, tools) are gone from the repository.
  - Every relative link of the documentation points to a file that exists.
depends: []
