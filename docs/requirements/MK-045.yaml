id: MK-045
title: Calendar (app-calendar)
area: extensions
priority: P3
status: planned
description: >-
  The extension app-calendar offers personal and team calendars, with events, invitations and reminders
  in the activity feed; meetings with audio and video are not part of it.
acceptance:
  - A person creates an event for a team and its members receive the invitation in the activity feed.
  - Reminders arrive as notifications before the event.
depends: [MK-032, MK-038]
