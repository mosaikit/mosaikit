id: MK-050
title: Extensions tested on their own, on a published snapshot of the kernel
area: sdk
priority: P1
status: done
description: >-
  An extension lives in a repository of its own and is tested there without building the kernel
  (ADR-0035). @mosaikit/testing starts a real installation with the extension on an embedded
  PostgreSQL, with an organization and people who confirmed their address, for npm run dev
  (mosaikit-bench) and for Playwright tests; create-mosaikit-extension writes both. Until the first
  release the installation comes from the pre-release snapshot that every push to main publishes,
  with the extension API and the npm packages of the SDK. The end-to-end tests of the kernel run on
  the same bench, with fixture extensions under tests/fixtures/extensions.
acceptance:
  - A generated extension passes npm test on the bench, frontend-only and with Java code.
  - The kernel end-to-end suite runs on the bench and installs only fixture extensions.
  - Every push to main publishes the installation, the extension API and the npm packages of the SDK in the pre-release snapshot.
depends: [MK-023, MK-049]
