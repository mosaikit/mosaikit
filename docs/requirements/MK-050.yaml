id: MK-050
title: Plugins tested on their own, on a published snapshot of the kernel
area: sdk
priority: P1
status: done
description: >-
  A plugin lives in a repository of its own and is tested there without building the kernel
  (ADR-0035). @mosaikit/testing starts a real installation with the plugin on an embedded
  PostgreSQL, with an organization and people who confirmed their address, for npm run dev
  (mosaikit-bench) and for Playwright tests; create-mosaikit-plugin writes both. Until the first
  release the installation comes from the pre-release snapshot that every push to main publishes,
  with the plugin API and the npm packages of the SDK. The end-to-end tests of the kernel run on
  the same bench, with fixture plugins under tests/fixtures/plugins.
acceptance:
  - A generated plugin passes npm test on the bench, frontend-only and with Java code.
  - The kernel end-to-end suite runs on the bench and installs only fixture plugins.
  - Every push to main publishes the installation, the plugin API and the npm packages of the SDK in the pre-release snapshot.
depends: [MK-023, MK-049]
