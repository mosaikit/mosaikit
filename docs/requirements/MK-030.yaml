id: MK-030
title: Apps of the app bar per organization and role
area: extensions
priority: P1
status: done
description: >-
  Administrators of an organization choose which apps of the active extensions appear in its app bar,
  in which order and for which roles (teams come with MK-032); pinned apps cannot be hidden by
  people. When all the apps of an extension are off, its API and its documents refuse the organization.
acceptance:
  - An app disabled for an organization does not appear in its app bar, and its API refuses the people of that organization.
  - The order and the pinned apps set by the administrator are the same for every person of the organization.
depends: [MK-002, MK-025]
