id: MK-042
title: Files of people, teams, channels and chats (app-files)
area: extensions
priority: P1
status: planned
description: >-
  The extension app-files shows the files of the person, of the teams and channels and of the chats,
  with folders, versions, previews and sharing, on the file service of the kernel. See ADR-0029.
acceptance:
  - A file uploaded to a channel appears in its Files tab and in app-files for every member.
  - A file attached to a message of a chat is readable only by the people of the chat.
  - A new version keeps the previous ones, which can be opened and restored.
depends: [MK-035, MK-036, MK-041]
