id: MK-008
title: Shell with sign-in, launcher and extension apps
area: shell
priority: P1
status: done
description: >-
  The shell hosts extension frontends and offers the apps they contribute.
acceptance:
  - People sign in with a local account.
  - The launcher lists the launcher.app contributions of active extensions with a valid route and element.
  - An extension whose module fails to load or activate is reported and skipped.
depends: [MK-006, MK-009]
