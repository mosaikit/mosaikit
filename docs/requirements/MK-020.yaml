id: MK-020
title: Extensions that extend other extensions
area: extensions
priority: P1
status: done
description: >-
  An extension extends another one on three levels without foreign keys between their schemas: data (a
  table of its own keyed by the identifiers of the other extension, which it reads through views that
  extension publishes as its data contract), user interface (widgets contributed to the extension
  points the other frontend declares) and behaviour (events on the bus). Demonstrated by the
  sample Activities app and its Estimates extension. Prototype spikes S2 and S3. See ADR-0019.
acceptance:
  - A frontend declares extension points and receives the contributions of other extensions to them.
  - The migrations of an extension run after those of the extensions it requires.
  - The Estimates extension adds a field, a widget and an event to Activities without a foreign key, and its reads of Activities data respect the organization of the request.
depends: [MK-006, MK-009, MK-019]
