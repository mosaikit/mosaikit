id: MK-016
title: Portable distribution for a single organization
area: distribution
priority: P1
status: done
description: >-
  Spike S5 of the prototype. One archive per operating system (Windows, Linux, macOS) that runs
  without installing Java, PostgreSQL or containers: a Java 25 runtime reduced with jlink, the
  kernel as mutable JAR, PostgreSQL 18 binaries started by the launcher, and an extensions folder.
  It serves one organization with local accounts, for demonstrations, offline sites and
  extension developers.
acceptance:
  - The archive starts with one command on a machine without Java or PostgreSQL, and the kernel answers in less than 30 seconds on first start.
  - Data survive a restart and can be backed up by copying the data folder while the kernel is stopped.
  - An extension copied into the extensions folder is active after a restart, through the same launcher as MK-011.
  - Memory of the whole distribution at rest stays below 600 MB.
depends: [MK-003, MK-011]
