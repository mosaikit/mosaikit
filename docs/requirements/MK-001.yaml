id: MK-001
title: Publish product information, health and API documentation
area: kernel
priority: P1
status: done
description: >-
  The shell and operators need to know which product and version is running, whether it is
  healthy, and what the API offers, before anyone signs in.
acceptance:
  - GET /api/v1/system/info returns name, kernel version and number of active extensions without authentication.
  - Readiness and liveness are exposed under /q/health.
  - The OpenAPI document is exposed under /q/openapi.
  - Every response carries X-Content-Type-Options, X-Frame-Options and Referrer-Policy headers.
