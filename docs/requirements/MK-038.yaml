id: MK-038
title: Activity feed and notifications for extensions
area: kernel
priority: P1
status: done
description: >-
  Extensions notify people or teams through kernel-api; the kernel keeps the notifications in the
  activity feed of each person, marks them read and pushes them on the real-time channel. People
  choose which notifications they receive. The push notifications of the browser come with MK-039.
  See ADR-0028.
acceptance:
  - A notification sent by an extension appears in the activity feed of the addressees and opens the item it refers to.
  - A person who turns off a kind of notification no longer receives it.
depends: [MK-031]
