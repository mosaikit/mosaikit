<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mosaikit</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --panel2:#1e232d; --line:#2a3140;
          --fg:#e6e9ef; --dim:#8b94a7; --acc:#4f8cff; --ok:#3fb27f; --err:#e05c5c; }
  * { box-sizing:border-box; margin:0; }
  body { font:14px/1.45 system-ui,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--fg); height:100vh; }
  input,select,textarea,button { font:inherit; }
  input,select,textarea { background:var(--panel2); border:1px solid var(--line); color:var(--fg);
      border-radius:6px; padding:7px 9px; width:100%; }
  input:focus,select:focus,textarea:focus { outline:none; border-color:var(--acc); }
  button { background:var(--acc); color:#fff; border:0; border-radius:6px; padding:8px 14px; cursor:pointer; }
  button.ghost { background:var(--panel2); border:1px solid var(--line); color:var(--fg); }
  button.danger { background:var(--err); }
  button:disabled { opacity:.5; cursor:default; }
  .hidden { display:none !important; }

  /* login */
  #login { height:100vh; display:flex; align-items:center; justify-content:center; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px;
      padding:32px; width:340px; }
  .card h1 { font-size:22px; margin-bottom:4px; }
  .card .sub { color:var(--dim); margin-bottom:20px; font-size:13px; }
  .card label { display:block; margin:12px 0 4px; color:var(--dim); font-size:12px; }
  .card button { width:100%; margin-top:18px; }
  #login-err { color:var(--err); font-size:13px; margin-top:10px; min-height:1em; }

  /* shell */
  #shell { display:grid; grid-template-columns:76px 1fr; grid-template-rows:1fr 44px;
      height:100vh; }
  #iconbar { grid-row:1; background:var(--panel); border-right:1px solid var(--line);
      display:flex; flex-direction:column; gap:8px; align-items:center; overflow-y:auto; }
  .iconbtn { width:64px; padding:8px 2px; background:var(--panel2); border:1px solid var(--line);
      border-radius:10px; color:var(--fg); text-align:center; cursor:pointer; font-size:11px; }
  .iconbtn:hover { border-color:var(--acc); }
  .iconbtn .ic { font-size:22px; display:block; }
  .iconbtn.sel { border-color:var(--acc); background:#22304a; }
  #main { grid-row:1; overflow:auto; padding:20px 26px; }
  #status { grid-column:1 / -1; background:var(--panel); border-top:1px solid var(--line);
      display:flex; align-items:center; gap:14px; padding:0 14px; color:var(--dim); font-size:12px; }
  #status .msg { flex:1; color:var(--fg); }
  #status .who { color:var(--ok); }

  h2 { font-size:18px; margin-bottom:14px; }
  .toolbar { display:flex; gap:8px; align-items:center; margin-bottom:14px; flex-wrap:wrap; }
  .toolbar input[type=text] { width:240px; }
  table { border-collapse:collapse; width:100%; background:var(--panel); }
  th,td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); font-size:13px; }
  th { color:var(--dim); font-weight:600; font-size:12px; }
  tr.row { cursor:pointer; }
  tr.row:hover td { background:var(--panel2); }
  tr.row.sel td { background:#22304a; }

  #form { background:var(--panel); border:1px solid var(--line); border-radius:10px;
      padding:18px; margin-top:18px; max-width:640px; }
  #form h3 { font-size:14px; margin-bottom:12px; color:var(--dim); }
  .frow { margin-bottom:10px; }
  .frow label { display:block; font-size:12px; color:var(--dim); margin-bottom:4px; }
  .frow label b { color:var(--err); }
  .frow input[type=checkbox] { width:auto; transform:scale(1.3); margin-left:2px; }

  /* modal plugin */
  #modal-bg { position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex;
      align-items:center; justify-content:center; z-index:10; }
  #modal { background:var(--panel); border:1px solid var(--line); border-radius:12px;
      width:720px; max-width:94vw; max-height:86vh; overflow:auto; padding:22px; }
  #modal h2 { display:flex; align-items:center; }
  #modal h2 button { margin-left:auto; }
  .plug { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); }
  .plug .pi { font-size:20px; }
  .plug .meta { flex:1; }
  .plug .meta small { color:var(--dim); display:block; }
  .dot { width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:4px; }
  .dot.on { background:var(--ok); } .dot.off { background:#666; }
  .install-row { display:flex; gap:8px; margin-top:14px; align-items:center; }
  .install-row input { flex:1; }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="card">
    <h1>⬡ Mosaikit</h1>
    <div class="sub">Accedi per gestire plugin e risorse</div>
    <label>Utente</label>
    <input id="lu" value="admin" autocomplete="username">
    <label>Password</label>
    <input id="lp" type="password" autocomplete="current-password">
    <button id="lbtn">Accedi</button>
    <div id="login-err"></div>
    <div class="sub" style="margin-top:16px">demo: admin/mosaikit2026! · user/demo1234</div>
  </div>
</div>

<!-- SHELL -->
<div id="shell" class="hidden">
  <div id="iconbar">
    <div id="ib-items"></div>
    <div class="iconbtn" id="ib-manage" title="Gestione plugin"><span class="ic">🧩</span>Plugin</div>
  </div>
  <div id="main">
    <div id="crud" class="hidden">
      <h2 id="crud-title"></h2>
      <div class="toolbar">
        <input type="text" id="flt" placeholder="🔍 filtra…">
        <button class="ghost" id="btn-new">➕ Nuovo</button>
        <span id="rowcount" style="color:var(--dim)"></span>
      </div>
      <table><thead id="crud-head"></thead><tbody id="crud-body"></tbody></table>
      <div id="form" class="hidden">
        <h3 id="form-title"></h3>
        <div id="form-fields"></div>
        <div class="toolbar" style="margin-top:14px;margin-bottom:0">
          <button id="btn-save">💾 Salva</button>
          <button class="ghost" id="btn-cancel">Annulla</button>
          <button class="danger hidden" id="btn-del">🗑 Elimina</button>
        </div>
      </div>
    </div>
    <div id="empty" style="color:var(--dim);margin-top:40px;text-align:center">
      Seleziona un'icona dalla barra laterale, oppure gestisci i plugin con 🧩
    </div>
  </div>
  <div id="status">
    <span class="who" id="st-who"></span>
    <span class="msg" id="st-msg">pronto</span>
    <button class="ghost" id="btn-logout" style="padding:5px 12px">Esci</button>
  </div>
</div>

<!-- MODAL PLUGIN -->
<div id="modal-bg" class="hidden">
  <div id="modal">
    <h2>🧩 Gestione plugin <button class="ghost" id="modal-close">✕</button></h2>
    <div id="plug-list"></div>
    <div class="install-row">
      <input type="file" id="pkg" accept=".mskp">
      <button id="btn-install">Installa pacchetto</button>
    </div>
    <div id="install-msg" style="color:var(--dim);font-size:12px;margin-top:8px"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let token = localStorage.getItem("msk_token") || null;
let username = localStorage.getItem("msk_user") || "";
let plugins = [], view = null, fields = [], rows = [], editingId = null;

async function api(method, path, body, isRaw) {
  const opts = { method, headers: {} };
  if (token) opts.headers["Authorization"] = "Bearer " + token;
  if (body !== undefined) {
    if (isRaw) { opts.body = body; }
    else { opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
  }
  const r = await fetch(path, opts);
  if (r.status === 401 && path !== "/login") { logoutLocal(); throw new Error("sessione scaduta"); }
  if (!r.ok) throw new Error((await r.text()) || ("HTTP " + r.status));
  const t = await r.text();
  return t ? JSON.parse(t) : {};
}
const msg = m => { $("st-msg").textContent = m; };

/* ---------- auth ---------- */
async function doLogin() {
  $("login-err").textContent = "";
  try {
    const r = await api("POST", "/login", { username: $("lu").value, password: $("lp").value });
    token = r.token; username = r.username;
    localStorage.setItem("msk_token", token);
    localStorage.setItem("msk_user", username);
    enterApp();
  } catch (e) { $("login-err").textContent = e.message; }
}
function logoutLocal() {
  token = null; localStorage.removeItem("msk_token"); localStorage.removeItem("msk_user");
  $("shell").classList.add("hidden"); $("login").classList.remove("hidden");
}
async function doLogout() { try { await api("POST", "/logout"); } catch(e){} logoutLocal(); }

function enterApp() {
  $("login").classList.add("hidden"); $("shell").classList.remove("hidden");
  $("st-who").textContent = "👤 " + username;
  msg("pronto");
  refreshPlugins();
}

/* ---------- plugin ---------- */
async function refreshPlugins() {
  try {
    const r = await api("GET", "/plugins");
    plugins = r.plugins;
    renderIconBar();
    renderPluginModal();
  } catch (e) { msg(e.message); }
}
function renderIconBar() {
  const el = $("ib-items"); el.innerHTML = "";
  for (const p of plugins.filter(p => p.active)) {
    const d = document.createElement("div");
    d.className = "iconbtn" + (view === p.view ? " sel" : "");
    d.innerHTML = `<span class="ic">${p.icon}</span>${p.label}`;
    d.onclick = () => openView(p.view, p.label);
    el.appendChild(d);
  }
}
function renderPluginModal() {
  const el = $("plug-list"); el.innerHTML = plugins.length ? "" : "<div style='color:var(--dim)'>Nessun plugin installato.</div>";
  for (const p of plugins) {
    const row = document.createElement("div"); row.className = "plug";
    row.innerHTML = `
      <span class="pi">${p.icon}</span>
      <div class="meta"><b>${p.label}</b> <span style="color:var(--dim)">v${p.version}</span>
        <small><span class="dot ${p.active?'on':'off'}"></span>${p.active?'attivo':'inattivo'} · ${p.id}</small></div>`;
    const mk = (label, cls, fn) => { const b = document.createElement("button");
      b.className = cls; b.textContent = label; b.onclick = fn; row.appendChild(b); };
    if (p.active) mk("Disattiva", "ghost", () => pluginOp("deactivate", p.id));
    else mk("Attiva", "", () => pluginOp("activate", p.id));
    mk("Disinstalla", "danger", async () => {
      if (!confirm("Disinstallare " + p.id + "?")) return;
      await pluginOp("uninstall", p.id, "DELETE");
    });
    el.appendChild(row);
  }
}
async function pluginOp(op, id, method) {
  try {
    await api(method || "POST", op === "uninstall" ? "/plugins/" + id : `/plugins/${id}/${op}`);
    msg(op + " ok: " + id);
    if (op !== "activate" && view) { /* vista potrebbe sparire */ }
    await refreshPlugins();
    if (view && !plugins.some(p => p.active && p.view === view)) { view = null; showEmpty(); }
    else if (view) await openView(view);
  } catch (e) { msg(e.message); }
}
async function doInstall() {
  const f = $("pkg").files[0];
  $("install-msg").textContent = "";
  if (!f) { $("install-msg").textContent = "seleziona un file .mskp"; return; }
  try {
    const r = await api("POST", "/plugins/install", f, true);
    $("install-msg").textContent = "installato: " + r.installed;
    $("pkg").value = ""; await refreshPlugins();
  } catch (e) { $("install-msg").textContent = "errore: " + e.message; }
}

/* ---------- CRUD ---------- */
async function openView(v, label) {
  try {
    const r = await api("GET", "/resources/" + encodeURIComponent(v) + ($("flt").value ? "?filter=" + encodeURIComponent($("flt").value) : ""));
    view = v; fields = r.fields; rows = r.rows;
    $("crud-title").textContent = (label || v);
    $("empty").classList.add("hidden"); $("crud").classList.remove("hidden");
    renderIconBar(); renderTable(); closeForm();
  } catch (e) { msg(e.message); }
}
function renderTable() {
  $("crud-head").innerHTML = "<tr><th>#</th>" + fields.map(f => `<th>${f.label}</th>`).join("") + "</tr>";
  const tb = $("crud-body"); tb.innerHTML = "";
  $("rowcount").textContent = rows.length + " righe";
  for (const r of rows) {
    const tr = document.createElement("tr");
    tr.className = "row" + (editingId === r.id ? " sel" : "");
    tr.innerHTML = `<td>${r.id}</td>` + fields.map(f => `<td>${esc(r.values[f.key]||"")}</td>`).join("");
    tr.onclick = () => { editingId = r.id; fillForm(r); renderTable(); };
    tb.appendChild(tr);
  }
}
function fieldInput(f, val) {
  const v = val || "";
  if (f.kind === "bool") return `<input type="checkbox" data-k="${f.key}" ${v === "✓" || v === "true" ? "checked" : ""}>`;
  if (f.kind === "choice") return `<select data-k="${f.key}"><option value="">…</option>` +
    f.options.map(o => `<option ${o===v?"selected":""}>${o}</option>`).join("") + "</select>";
  if (f.kind === "number") return `<input type="number" step="any" data-k="${f.key}" value="${esc(v)}">`;
  if (f.kind === "date") return `<input type="date" data-k="${f.key}" value="${esc(v)}">`;
  if (f.multiline) return `<textarea rows="3" data-k="${f.key}">${esc(v)}</textarea>`;
  return `<input type="text" data-k="${f.key}" value="${esc(v)}">`;
}
function fillForm(row) {
  $("form").classList.remove("hidden");
  $("form-title").textContent = (row ? "Modifica record #" + row.id : "Nuovo record");
  $("btn-del").classList.toggle("hidden", !row);
  $("form-fields").innerHTML = fields.map(f =>
    `<div class="frow"><label>${f.label}${f.required?" <b>*</b>":""}</label>${fieldInput(f, row ? row.values[f.key] : "")}</div>`).join("");
  $("form").scrollIntoView({ behavior: "smooth", block: "nearest" });
}
function closeForm() { editingId = null; $("form").classList.add("hidden"); }
function formValues() {
  const out = {};
  document.querySelectorAll("#form-fields [data-k]").forEach(el => {
    out[el.dataset.k] = el.type === "checkbox" ? (el.checked ? "true" : "") : el.value;
  });
  return out;
}
async function saveForm() {
  try {
    if (editingId) await api("PUT", `/resources/${view}/rows/${editingId}`, { values: formValues() });
    else { await api("POST", `/resources/${view}/rows`, { values: formValues() }); }
    msg("salvato"); closeForm(); await openView(view);
  } catch (e) { msg(e.message); }
}
async function delRow() {
  if (!editingId || !confirm("Eliminare #" + editingId + "?")) return;
  try { await api("DELETE", `/resources/${view}/rows/${editingId}`); msg("eliminato"); closeForm(); await openView(view); }
  catch (e) { msg(e.message); }
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
function showEmpty() { $("crud").classList.add("hidden"); $("empty").classList.remove("hidden"); }

/* ---------- wiring ---------- */
$("lbtn").onclick = doLogin;
$("lp").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
$("btn-logout").onclick = doLogout;
$("ib-manage").onclick = () => { $("modal-bg").classList.remove("hidden"); refreshPlugins(); };
$("modal-close").onclick = () => $("modal-bg").classList.add("hidden");
$("modal-bg").onclick = e => { if (e.target === $("modal-bg")) $("modal-bg").classList.add("hidden"); };
$("btn-install").onclick = doInstall;
$("btn-new").onclick = () => { editingId = null; fillForm(null); renderTable(); };
$("btn-save").onclick = saveForm;
$("btn-cancel").onclick = () => { closeForm(); renderTable(); };
$("btn-del").onclick = delRow;
let fltT = null;
$("flt").addEventListener("input", () => { clearTimeout(fltT); fltT = setTimeout(() => view && openView(view), 250); });

if (token) { api("GET", "/plugins").then(r => { enterApp(); }).catch(() => {}); }
</script>
</body>
</html>
