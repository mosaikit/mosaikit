[package]
name = "mosaikit-server"
version = "0.1.0"
edition = "2021"
description = "Mosaikit server HTTP: adapter REST sopra mosaikit-kernel. Il kernel non cambia."

[dependencies]
# kernel in modalita' std-only (persistenza JSON): niente C/SQLite da compilare
mosaikit-kernel = { path = "../mosaikit-kernel", default-features = false }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["cors"] }
rust-embed = "8"
mime_guess = "2"
